    save(); renderChips(); render(); toast("已删除这条新增用例"); return;
  }
  if (e.target.closest("[data-undo-move]")) {
    const mv = moves.pop(); localStorage.setItem(MOVE_STORE, JSON.stringify(moves));
    renderProgress(); render(); toast(`已撤销：${mv.from.split("/").pop()} → ${mv.to.split("/").pop()}`); return;
  }
  if (e.target.closest("[data-rename]")) { startRename(e.target.closest(".node")); return; }
  if (e.target.closest("input.rename")) return;
  const node = e.target.closest(".node");
  if (node) { if (node.dataset.path === selectedNode) return; selectedNode = node.dataset.path; expandTo(selectedNode); render(); return; }
  if (e.target.closest("[data-revert]")) {
    const key = e.target.closest(".case").dataset.key;
    delete edits[key]; delete drafts[key]; localStorage.setItem(EDIT_STORE, JSON.stringify(edits));
    if (byKey(key).kind === "退回" && confirmed(key)) { marks[key].status = undefined; prune(key); save(); }
    renderChips(); renderProgress(); render(); return;
  }
  const btn = e.target.closest(".review button");
  if (btn) {
    const key = btn.closest(".case").dataset.key, m = marks[key] ||= {};
    m.status = m.status === btn.dataset.act ? undefined : btn.dataset.act;
    const c0 = byKey(key), asIs = m.status === "ok" && c0.kind === "退回" && !edits[key];
    if (m.status === "ok" && c0.fresh && !edits[key]) {
      m.status = undefined; prune(key);
      const need = btn.closest(".case").querySelector(".need");
      need.textContent = "不能确认：先在表格里填写用例名称、前置条件、步骤描述和预期结果"; need.classList.add("err"); return;
    }
    if (asIs) edits[key] = {kind: c0.kind, row: c0.row, oldIds: c0.oldIds, before: c0.name, data: JSON.parse(JSON.stringify(current(c0)))};
    if (m.status !== "ok" && c0.kind === "退回" && edits[key] && EDIT_FIELDS.every(([, g]) => (g(current(c0)) || "") === (g(edits[key].data) || ""))) {
      delete edits[key]; delete drafts[key]; localStorage.setItem(EDIT_STORE, JSON.stringify(edits));
    }
    if (m.status === "ok" && edits[key]) {
      const err = editError(key);
      if (err) {
        m.status = undefined; prune(key);
        if (asIs) delete edits[key];
        const need = btn.closest(".case").querySelector(".need");
        need.textContent = "不能确认：" + err + (asIs ? "。退回用例请先在「补齐后」一栏补齐，或点「不迁移」" : ""); need.classList.add("err"); return;
      }
      delete drafts[key]; localStorage.setItem(EDIT_STORE, JSON.stringify(edits));
    }
    prune(key);
    const c = byKey(key), was = filter.kind;
    save(); renderChips(); render();
    if (was && was !== "已确认" && shown(c) === "已确认") toast("已移到「已确认」");
    else if (was && was !== "不迁移" && shown(c) === "不迁移") toast("已移到「不迁移」，可以在「不迁移」分类里给这条写原因", 4000);
    else if ((was === "已确认" || was === "不迁移") && shown(c) !== was) toast(`已移回「${KIND_LABEL[c.kind]}」`);
    if (m.status === "issue" || m.status === "skip") document.querySelector(`.case[data-key="${key}"] textarea.note`)?.focus();
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { filter.q = e.target.value; render(); return; }
  if (e.target.matches(".nv textarea")) {
    const key = e.target.closest(".case").dataset.key, n = e.target.closest(".nv").dataset.field, v = e.target.value, c0 = byKey(key);
    onEdit(key, (d) => {
      if (n === "用例名称") d.name = v.replace(/\n/g, " ");
      if (n === "所属模块") { const m = v.replace(/\n/g, " ").trim(); d.module = m === movePath(c0.module) || m === c0.module ? "" : m; }
      if (n === "前置条件") d.pre = v;
      if (n === "备注") d.remark = v;
      if (n === "标签") d.tags = v;
      if (n === "步骤描述") d.steps = pairs(v, numberedText(d.steps, 1));
      if (n === "预期结果") d.steps = pairs(numberedText(d.steps, 0), v);
    });
    refresh(key); return;
  }
  if (e.target.matches(".review textarea")) {
    const key = e.target.closest(".case").dataset.key, m = marks[key] ||= {};
    m.note = e.target.value; prune(key);
    localStorage.setItem(STORE, JSON.stringify(marks)); renderProgress();
  }
});
function addCase() {
  const node = findNode(moduleTree(visible()), selectedNode || "");
  const near = (node && allCases(node).find((c) => !isClosed(c))) || DATA.cases.find((c) => !isClosed(c)) || DATA.cases[0];
  const module = (node && node.abs) || modOf(near);
  const a = {key: "a" + Date.now(), module};
  added.push(a); localStorage.setItem(ADD_STORE, JSON.stringify(added));
  DATA.cases.push(blankCase(a));
  filter.kind = null; filter.q = ""; $("#q").value = "";
  renderChips(); renderProgress(); render();
  const art = document.querySelector(`.case[data-key="${a.key}"]`);
  art.scrollIntoView({block: "center"});
  art.querySelector('.nv[data-field="用例名称"]').dispatchEvent(new MouseEvent("mousedown", {bubbles: true}));
  toast(`已在「${module.split("/").pop()}」下新增一条用例：填好名称、步骤和预期结果后点「✓ 已确认」`, 4000);
}
function startRename(node) {
  if (!node || !node.dataset.abs || node.querySelector("input.rename")) return;
  const isRoot = !node.dataset.path, abs = node.dataset.abs, nm = node.querySelector(".nm");
  const top = abs.split("/")[1], old = isRoot ? abs.slice(top.length + 2) : abs.split("/").pop();
  node.draggable = false;
  nm.outerHTML = `<input class="rename" value="${esc(old)}">`;
  node.querySelector(".ren")?.remove();
  const input = node.querySelector("input.rename");
  input.focus(); input.select();
  let done = false;
  const finish = (save) => {
    if (done) return; done = true;
    const v = input.value.trim();
    if (!save || v === old) return render();
    if (isRoot) {
      const parts = v.split("/").map((p) => p.trim());
      if (parts.some((p) => !p)) { toast("每一级都不能为空"); return render(); }
      if (parts[0] !== old.split("/")[0]) { toast(`第一级是 Squad「${old.split("/")[0]}」，不能改`); return render(); }
      const to = `/${top}/${parts.join("/")}`;
      if (to.startsWith(abs + "/")) { toast("不能把目录移到它自己下面"); return render(); }
      return moveModule(abs, to, `已改名为「${parts.join("/")}」`);
    }
    if (!v || v.includes("/")) { toast("模块名不能为空，也不能包含 /"); return render(); }
    const to = parentOf(abs) + "/" + v, merged = findAbs(moduleTree(DATA.cases), to);
    moveModule(abs, to, `已改名为「${v}」` + (merged ? "，和已有的同名模块合并" : ""));
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); });
  input.addEventListener("blur", () => finish(true));
}
document.addEventListener("dblclick", (e) => { if (!e.target.closest("input.rename")) startRename(e.target.closest(".node")); });
let dragAbs = null;
const canDrop = (tgt) => dragAbs !== null && !!tgt && tgt !== dragAbs && !tgt.startsWith(dragAbs + "/") && tgt !== parentOf(dragAbs);
document.addEventListener("dragstart", (e) => {
  const node = e.target.closest?.(".node[draggable=true]");
  if (!node) return;
  dragAbs = node.dataset.abs; node.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragAbs);
});
document.addEventListener("dragover", (e) => {
  const node = e.target.closest?.(".node");
  document.querySelectorAll(".node.drop-ok").forEach((x) => x !== node && x.classList.remove("drop-ok"));
  if (!node || !canDrop(node.dataset.abs)) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "move"; node.classList.add("drop-ok");
});
document.addEventListener("drop", (e) => {
  const node = e.target.closest?.(".node");
  if (!node || !canDrop(node.dataset.abs)) return;
  e.preventDefault();
  const name = dragAbs.split("/").pop(), to = node.dataset.abs + "/" + name, from = dragAbs;
  const merged = findAbs(moduleTree(DATA.cases), to);
  dragAbs = null;
  moveModule(from, to, `已把「${name}」移到「${node.querySelector(".nm").textContent}」下` + (merged ? "，和已有的同名模块合并" : ""));
});
document.addEventListener("dragend", () => {
  dragAbs = null;
  document.querySelectorAll(".node.dragging,.node.drop-ok").forEach((x) => x.classList.remove("dragging", "drop-ok"));
});
document.addEventListener("mousedown", (e) => {
  const cell = e.target.closest(".nv.editable");
  if (!cell || cell.querySelector("textarea, select")) return;
  e.preventDefault();
  const c = byKey(cell.closest(".case").dataset.key), n = cell.dataset.field;
  cell.classList.add("editing");
  if (n === "用例等级") {
    const cur = newOf(c, n);
    cell.innerHTML = `<select class="in">${(LEVELS.includes(cur) ? LEVELS : ["", ...LEVELS]).map((l) => `<option ${l === cur ? "selected" : ""} value="${l}">${l || "请选择"}</option>`).join("")}</select>`;
    const sel = cell.querySelector("select"); sel.focus(); try { sel.showPicker(); } catch {}
    return;
  }
  cell.innerHTML = `<textarea class="in" ${n === "用例名称" || n === "所属模块" ? 'rows="1"' : ""} placeholder="${n === "步骤描述" || n === "预期结果" ? "1、…\n2、…" : ""}">${esc(newOf(c, n))}</textarea>`;
  const t = cell.querySelector("textarea"); t.focus(); t.setSelectionRange(t.value.length, t.value.length);
});
document.addEventListener("focusout", (e) => {
  const cell = e.target.closest(".nv");
  if (!cell) return;
  const c = byKey(cell.closest(".case").dataset.key), n = cell.dataset.field;
  cell.classList.remove("editing");
  if (cell.matches("h3.title")) { cell.textContent = titleOf(c.key); return; }
  cell.innerHTML = newCell(c, n);
  if (NEW_ONLY) { cell.previousElementSibling.innerHTML = labelHtml(c, n); return; }
  cell.previousElementSibling.innerHTML = oldCell(c, n);
  cell.previousElementSibling.previousElementSibling.innerHTML = labelHtml(c, n);
});
document.addEventListener("keydown", (e) => {
  if (!e.target.matches(".nv textarea")) return;
  if (e.key === "Escape" || (e.key === "Enter" && (e.metaKey || e.ctrlKey))) { e.preventDefault(); e.target.blur(); }
  else if (e.key === "Enter" && ["用例名称", "所属模块"].includes(e.target.closest(".nv").dataset.field)) e.preventDefault();
});
document.addEventListener("change", (e) => {
  if (!e.target.matches(".nv select, select.lvl")) return;
  const key = e.target.closest(".case").dataset.key, v = e.target.value;
  onEdit(key, (d) => { d.level = v; });
  refresh(key); e.target.blur();
});
$("#exportAll").onclick = exportAll;
renderHead(); renderProgress(); render();
if (roundReset) toast("清单已按上次的审核结果重建，上一轮的标记、修改和目录调整都已写入，这一轮从头审核", 8000);
</script>
