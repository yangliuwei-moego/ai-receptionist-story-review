序。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、业务系统中有一份与客户最后确认内容一致的 Boarding 预约，归属于正确的客户、宠物和门店。\n4、没有重复创建，没有客户未选择的 add-on。\n5、成功的说法有明确、可归属于本次操作的业务结果支持。\n6、可用性在房型承诺和预约创建之前确认。\n7、期望处理：自助完成；业务系统中有一份与客户最后确认内容一致的 Boarding 预约，归属于正确的客户、宠物和门店。；没有重复创建，没有客户未选择的 add-on。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G01 既有客户预订 Boarding\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/book-boarding/customer-books-boarding.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：自助完成"}, {"name": "标签", "old": "", "new": "story:G01,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r3", "row": 3, "name": "检查 G02 既有客户为多只宠物预订同一段 Boarding", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Boarding Daycare", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c2467aff3d1", "fp": "f1102cf76db2", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G02 既有客户为多只宠物预订同一段 Boarding"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Boarding Daycare"}, {"name": "前置条件", "old": "", "new": "与 G01 相同；另外每只宠物都已建档，同一段日期里有能容纳完整宠物组合的真实安排。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：在一次电话中为它们订好同一段未来日期的 Boarding\n3、明确完整的宠物组合和日期：确认这次包含哪几只宠物、同一个 drop-off 日期和 pick-up 日期。客户先只提到其中一只时，帮客户把最终的组合说清楚，不擅自把档案里的其他宠物加进来。\n4、按完整组合查询可用性和房型：每只宠物各自适用某种房型，不能说明它们可以同住一间；同住必须有覆盖完整组合的当前查询结果支持。房型的容量和同住条件按当前的具体房型、宠物组合和门店规则判断，不从其他房型、其他组合或以前的预约外推。\n5、确定同住还是分开住：同住一间或分开住，都必须是当前真实可订的安排。由客户决定并确认，Agent 不替客户选。客户想要的同住放不下时见 C07。\n6、逐只处理疫苗、add-on 和照护说明：每只宠物的疫苗按它自己的记录和入住日期核对；add-on 按宠物分别选；客户在电话中说明或更正照护说明时，只作用于他指定的那只宠物和那一项。一只宠物的记录、选择或历史不套用到另一只。指代不清时先澄清。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果 和宠物档案，没有重复档案，没有编造的资料；新宠物归属于正确的客户；预约的要求与 G01 相同。\n4、电话里：没有疫苗记录的新宠物，没有被记成或说成疫苗合格。\n5、短信里：没有建立客户或宠物档案，没有创建预约或候补，也没有保留名额。链接实际发送成功才算送达，发送尝试不算；链接送达不算预约成功。\n6、确认是新客户，先于建档，也先于发送链接。\n7、期望处理：电话内建档后自助完成；电话里：只建立这次预约确实需要的一份客户档案和宠物档案，没有重复档案，没有编造的资料；新宠物归属于正确的客户；预约的要求与 G01 相同。；电话里：没有疫苗记录的新宠物，没有被记成或说成疫苗合格。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G03 首次客户预订 Boarding\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/book-boarding/first-time-customer-books-boarding.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：电话内建档后自助完成"}, {"name": "标签", "old": "", "new": "story:G03,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r5", "row": 5, "name": "检查 G05 既有客户预订 Daycare", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Boarding Daycare", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cca0b27b3da", "fp": "4604027c7e05", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G05 既有客户预订 Daycare"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Boarding Daycare"}, {"name": "前置条件", "old": "", "new": "来电号码唯一匹配到客户档案；宠物已在档案中；目标日期不是当天，门店当天营业，并有适用于这只宠物、当前可订的 Daycare 服务；没有触发任何条件 Story。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：在一次电话中为档案里的一只宠物订好某一天的 Daycare\n3、识别并问候：号码唯一匹配即具备客户身份，不做第二次身份验证，也不要求客户重复电话号码。客户已说明要订 Daycare 时，不再重复确认意图。\n4、明确宠物和日期：确定是哪一只宠物、哪一天。已经明确且没有变化的信息不重复询问。\n5、查询并说明可用性：按门店、宠物和明确的日期查询，明确告诉客户那天是否可订。以前的预约、其他宠物或其他日期的结果不能代替这次查询；客户改了宠物、日期或服务后，之前的结论失效。\n6、确定 Daycare 服务：帮客户选定当前适用于这只宠物的 Daycare 服务。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、业务系统中有一份与客户最后确认内容一致的 Daycare 预约，归属于正确的客户、宠物、门店和日期。\n4、没有重复创建客户、宠物或预约，没有客户未选择的 add-on。\n5 后自助完成；电话里：只建立这次预约确实需要的一份客户档案和宠物档案，没有重复档案，没有编造的资料；新宠物归属于正确的客户；预约的要求与 G05 相同。；电话里：没有疫苗记录的新宠物，没有被记成或说成疫苗合格。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G06 首次客户预订 Daycare\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/book-daycare/first-time-customer-books-daycare.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：电话内建档后自助完成"}, {"name": "标签", "old": "", "new": "story:G06,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r7", "row": 7, "name": "检查 G07 既有客户预订 Salon Grooming", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Salon Grooming", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cbd78ae9faf", "fp": "bb59fff26b43", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G07 既有客户预订 Salon Grooming"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Salon Grooming"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；宠物已在档案中且资料完整；有适用的服务，客户接受的时间范围内有合格美容师的真实空位；没有触发任何条件 Story。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：在一次电话中为宠物约好到店美容：做什么服务、由哪位美容师做、哪天几点开始\n3、识别客户：只用本次来电号码查询档案，匹配到即按老客户办理，不做第二次身份验证。\n4、确认宠物并核对资料：明确为哪只宠物预约。名字、Dog／Cat、品种、体重四项齐全有效时直接复用，不重复询问。只缺品种或体重时，向客户收集并实际保存成功后再继续。名字或 Dog／Cat 缺失、已有值需要修改时，Agent 不自行修改，人工承…\n5、核对预约前置条件：请客户最终确认之前，核对 card on file 和设为 required 的疫苗，并让核对结果生效。card on file 不合格时进入 C06；疫苗不合格时按门店的规矩进入 C04 或 C17。设为 option…\n6、确定服务：保留客户已经表达的需求，匹配到门店当前向外开放、且这只宠物满足条件的具体服务，用客户听得懂的方式说明包含什么。服务包含的内容以门店的服务说明为准，不凭名称推断。客户没有明确服务时，先参考这只宠物最近一次已完成服务的内容，确认是否…\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、预约属于正确的客户、宠物和门店，服务、美容师和时间与客户最后确认的一致。\n4、所约服务当前向外开放且适用于这只宠物；美容师有资格做这项服务，约定时间是当前真实空位。\n5、没有重复预约，没有客户未选择的收费项目。\n6、宠物资料只补全了缺失的品种或体重，没有覆盖已有值。\n7、期望处理：自助完成；预约属于正确的客户、宠物和门店，服务、美容师和时间与客户最后确认的一致。；所约服务当前向外开放且适用于这只宠物；美容师有资格做这项服务，约定时间是当前真实空位。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G07 既有客户预订 Salon Grooming\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/book-salon-grooming/customer-books-salon-grooming.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：自助完成"}, {"name": "标签", "old": "", "new": "story:G07,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r8", "row": 8, "name": "检查 G08 首次客户预订 Salon Grooming", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Salon Grooming", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c841edd8bc1", "fp": "46249c2c9bc6", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G08 首次客户预订 Salon Grooming"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Salon Grooming"}, {"name": "前置条件", "old": "", "new": "来电号码的档案查询成功，且没有匹配到任何档案；客户确认以前没有在这家门店登记过；按客户的姓名和宠物名也没有查到已有档案；没有触发其他条件 Story。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：先把想问的问清楚，然后当场登记并约好\n3、确认是新客户：号码没有匹配时，确认客户以前有没有在这家门店登记过。客户已经说明是第一次来时不必再问。\n4、先回答客户的问题：客户问服务、价格、空位或预约要求时先回答，不要求先登记。答复不等于预约，也不保留名额。\n5、说明并征得同意：告诉客户预约前需要先登记。客户愿意继续预约并同意登记后才建档；只是咨询不算同意。\n6、收集最少必要的资料：只收集门店和这次服务真正需要的客户和宠物资料，联系电话沿用本次来电号码。客户已经说过的内容不重复问。请客户确认姓名的拼写。品种有歧义时先澄清，不凭猜测保存。门店设为可选的资料，客户不知道或不愿提供时留空，不编造，也不因…\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、电话里：只建立这次预约确实需要的客户和宠物档案，没有重复档案，没有编造的资料；新宠物归属于正确的客户；预约的要求与 G07 相同。\n4、短信里：没有建立客户或宠物档案，没有创建预约或候补，也没有保留名额。链接实际发送成功才算送达，发送尝试不算；链接送达不算预约成功。\n5、确认是新客户，先于建档，也先于发送链接。\n6、客户同意登记，先于建档；查重，先于建档；建档成功，先于把新档案用于预约。\n7、期望处理：电话内建档后自助完成；电话里：只建立这次预约确实需要的客户和宠物档案，没有重复档案，没有编造的资料；新宠物归属于正确的客户；预约的要求与 G07 相同。；短信里：没有建立客户或宠物档案，没有创建预约或候补，也没有保留名额。链接实际发送成功才算送达，发送尝试不算；链接送达不算预约成功。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G08 首次客户预订 Salon Grooming\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/book-salon-grooming/first-time-customer-books-salon-grooming.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：电话内建档后自助完成"}, {"name": "标签", "old": "", "new": "story:G08,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r9", "row": 9, "name": "检查 G09 客户指定美容师预订 Salon Grooming", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Salon Grooming", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c1aa10dfab9", "fp": "73bb8aa09bee", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G09 客户指定美容师预订 Salon Grooming"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Salon Grooming"}, {"name": "前置条件", "old": "", "new": "与 G07 相同，另外客户点名的美容师在门店有资格做所选服务，并在客户接受的时间范围内有真实空位。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：Agent 直接按这位美容师来查能不能约、什么时候能约，并在约不上时让我自己决定是等、换时间还是换人\n3、认定客户指的是谁：客户说出名字时按名字确定；客户说“上次那位”时，按这只宠物最近一次已完成服务的美容师确定，并说出是谁让客户确认。不使用取消、未到店的记录，也不使用其他宠物的历史。\n4、按这位美容师核查：核查这位美容师当前是否有资格做所选服务，以及在客户要的时间范围内是否有真实空位。以前约过不能代替当前核查。\n5、先回答客户问的：客户指定了时间时，先说这位美容师在那个时间行不行，再说其他时间。\n6、确认并创建：其余步骤与 G07 相同。回顾和结果告知中明确说出美容师是谁。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、预约上的美容师就是客户最后同意的那一位。\n4、没有在客户不知情的情况下更换美容师。\n5、只有门店实际支持并保证的人选，才被当作承诺告诉客户。\n6、先确定指的是谁，再核查资格和空位，再作承诺。\n7、期望处理：自助完成；预约上的美容师就是客户最后同意的那一位。；没有在客户不知情的情况下更换美容师。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G09 客户指定美容师预订 Salon Grooming\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/book-salon-grooming/customer-books-with-requested-groomer.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：自助完成"}, {"name": "标签", "old": "", "new": "story:G09,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r10", "row": 10, "name": "检查 G10 既有客户预订 Mobile Grooming", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Mobile Grooming", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c2239511a87", "fp": "679ca3bc3bf4", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G10 既有客户预订 Mobile Grooming"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Mobile Grooming"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；宠物已在档案中；本次地址在服务范围内，并有能覆盖完整服务的美容师、车辆和行程；没有触发任何条件 Story。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：复用已有资料，确认这次美容师去哪个地址、做什么服务、哪天在什么时间段到，并完成预约\n3、识别客户并确认宠物：复用已识别的客户和宠物资料，不因换地址或换服务重新建档。\n4、确认本次服务地址：让客户确认这次美容师实际要去的地址。档案里有多个地址时，不把默认地址当作本次选择；客户提供新地址时，解决门牌、重名道路等歧义后回顾完整地址。\n5、按本次地址判断服务范围：即使客户以前接受过上门服务，也按本次确认的地址和当前范围判断。地址能识别不等于在范围内，在范围内不等于某一天有行程。\n6、确定服务：客户要“照上次做”时，按真实历史确定指的是什么，并核实当前仍适用于这只宠物。价格说明区分服务价格、上门相关费用和需要现场评估的部分。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、预约上的服务地址就是客户最后确认的地址，服务范围和行程判断都对应这个地址。\n4、没有沿用默认地址、过去的日期或已经失效的候选时间。\n5、为本次预约使用某个地址，没有改动其他预约的地点或档案里的其他地址。\n6、没有重复预约，没有重复的客户或宠物档案。\n7、期望处理：自助完成；预约上的服务地址就是客户最后确认的地址，服务范围和行程判断都对应这个地址。；没有沿用默认地址、过去的日期或已经失效的候选时间。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G10 既有客户预订 Mobile Grooming\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/book-mobile-grooming/customer-books-mobile-grooming.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：自助完成"}, {"name": "标签", "old": "", "new": "story:G10,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r11", "row": 11, "name": "检查 G11 首次客户预订 Mobile Grooming", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Mobile Grooming", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c47a7987353", "fp": "1f65eedd9be0", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G11 首次客户预订 Mobile Grooming"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Mobile Grooming"}, {"name": "前置条件", "old": "", "new": "来电号码的档案查询成功，且没有匹配到任何档案；客户确认以前没有在这家商家登记过；客户这次的上门地址在服务范围内；商家配置了 intake 表链接，来电号码可以接收短信；没有触发其他条件 Story。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：一次联系就知道这家商家能不能来我家、大概多少钱，并把约之前要交的材料交上去\n3、确认是新客户：号码没有匹配时，确认客户以前有没有在这家商家登记过。客户已经说明是第一次约时不必再问。\n4、先确认上门地址在服务范围内：让客户说明这次美容师要去的地址，解决门牌、重名道路等歧义后回顾完整地址，并按当前服务范围判断。地址不在范围内时不报价、不建档、不发链接（见分支）。\n5、回答客户的问题：客户问价格、服务或最早什么时候能来时照常回答（G38）。答复不等于预约，也不保留名额。\n6、说明办理方式：告诉客户新客户要先交材料，商家看完后会联系确认时间；这通电话里不约。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、默认规矩下，会话中没有创建预约或候补，也没有保留名额。\n4、只建立一份潜在客户档案和这次需要的宠物档案，没有重复档案，没有编造的资料。\n5、链接实际发送成功才算送达，发送尝试不算；链接送达不算预约成功。\n6、待办实际留下，商家看完材料不用再问一遍客户就能约。\n7、期望处理：默认先交材料：建潜在客户档案，发链接（intake 表），留待办；默认规矩下，会话中没有创建预约或候补，也没有保留名额。；只建立一份潜在客户档案和这次需要的宠物档案，没有重复档案，没有编造的资料。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G11 首次客户预订 Mobile Grooming\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/book-mobile-grooming/first-time-customer-books-mobile-grooming.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：默认先交材料：建潜在客户档案，发链接（intake 表），留待办"}, {"name": "标签", "old": "", "new": "story:G11,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r12", "row": 12, "name": "检查 G12 既有客户为多只宠物预订同一次 Mobile Grooming", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Mobile Grooming", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c140bd58afe", "fp": "0cb5487bcb80", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G12 既有客户为多只宠物预订同一次 Mobile Grooming"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Mobile Grooming"}, {"name": "前置条件", "old": "", "new": "与 G10 相同，另外每只宠物都已建档并各自满足预约要求，同一个地址、同一天存在能承载全部宠物和服务的真实安排。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：分别选定每只宠物的服务，并确认这一次上门能把它们全部做完后再预约\n3、明确完整的宠物组合：确认本次包含哪些宠物、是否在同一个地址、是否要求同一次上门。客户在中途提到另一只宠物时，把请求更新为完整组合，不把它记成留言，也不默认沿用第一只的服务。\n4、按宠物分别确定服务：每只宠物的服务适用性、所选服务、附加项目和前置条件独立确定。品种相同或服务名称相似不能说明两只适用同样的项目。客户更正某只宠物的内容时，只改它；指代不清时先澄清。\n5、按完整组合核查可用性：确认这一次上门有足够的服务时间、人员和行程做完全部宠物的全部服务。每只宠物分别有空，不能拼成“一起都能约”。增加宠物或影响时长的项目后重新核查，不沿用只覆盖部分宠物的时间。\n6、按完整组合报价：已经为第一只宠物报过价时，加入其他宠物后说明各自的价格和整体的上门相关费用，不让客户以为之前的数字就是总价。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、每只宠物的服务和附加项目与各自确认的内容一致，没有遗漏宠物，没有交叉记录。\n4、可用性支持完整组合和所需时长，没有沿用单宠的结果。\n5、没有重复预约，没有客户未选择的项目。\n6、完整的宠物和服务组合确定后，才承诺整体可用性。\n7、期望处理：自助完成；每只宠物的服务和附加项目与各自确认的内容一致，没有遗漏宠物，没有交叉记录。；可用性支持完整组合和所需时长，没有沿用单宠的结果。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G12 既有客户为多只宠物预订同一次 Mobile Grooming\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/book-mobile-grooming/customer-books-multi-pet-mobile-grooming.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：自助完成"}, {"name": "标签", "old": "", "new": "story:G12,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r13", "row": 13, "name": "检查 G13 客户指定美容师预订 Mobile Grooming", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Mobile Grooming", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cc33385ad96", "fp": "d4dca38e1222", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G13 客户指定美容师预订 Mobile Grooming"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Mobile Grooming"}, {"name": "前置条件", "old": "", "new": "与 G10 相同，另外客户点名的美容师能做所选服务，其行程能到达本次地址，并在客户接受的时间范围内有真实安排。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：Agent 知道我说的是哪一位，按这位美容师告诉我能不能来、最早什么时候来，约不上时让我自己决定等还是换人\n3、认定客户指的是谁：客户说出名字时按名字确定；客户说“上次那位”时，按这只宠物最近一次已完成服务的美容师确定，并说出是谁让客户确认。\n4、弄清是偏好还是硬条件：客户没有说明时，在需要提供替代人选之前问清楚：只接受这位，还是其他美容师也可以。\n5、按这位美容师核查：核查这位美容师能否做所选服务、行程能否覆盖本次地址，以及最早的真实到达安排。以前由这位美容师服务过，不能代替当前核查。\n6、确认并创建：其余步骤与 G10 相同。回顾和结果告知中明确说出美容师是谁。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、预约上的美容师就是客户最后同意的那一位。\n4、硬条件没有被放宽；偏好没有被当作商家的保证。\n5、这位美容师的安排确实覆盖本次地址和完整服务。\n6、先确定指的是谁、是不是硬条件，再提供替代。\n7、期望处理：自助完成；预约上的美容师就是客户最后同意的那一位。；硬条件没有被放宽；偏好没有被当作商家的保证。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G13 客户指定美容师预订 Mobile Grooming\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/book-mobile-grooming/customer-books-with-requested-groomer.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：自助完成"}, {"name": "标签", "old": "", "new": "story:G13,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r14", "row": 14, "name": "检查 G14 上门地址不在服务范围内", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Mobile Grooming", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cf5f6581277", "fp": "03dfe5c472a6", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G14 上门地址不在服务范围内"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Mobile Grooming"}, {"name": "前置条件", "old": "", "new": "来电者想预约上门美容；地址已经确认清楚；按商家当前的服务范围，这个地址不能上门；来电者接受这个结果。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：尽快得到一个明确、如实的答复，并在我认为判断有误时有人来复核\n3、先把地址确认清楚：回顾完整地址并取得确认。门牌缺失、道路重名等歧义先解决，不对一个没有确认的地址下结论。\n4、如实说明结果：明确告诉来电者这个地址目前不在服务范围内，并且没有创建预约。\n5、停止不必要的收集：不向范围外的新来电者报价、建档或发送 intake 表链接，不继续收集宠物资料，不登记候补。\n6、告知真实存在的其他选择：商家有到店美容或其他服务范围内的选项时可以告知；没有时不编造。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、没有创建预约，没有登记候补，没有向范围外的新来电者报价、建档或发送 intake 表链接。\n4、范围判断对应来电者最后确认的地址。\n5、有异议时，员工拿到的是一条可行动的请求：地址、来电者是谁、异议的理由。同一通电话只有一条。\n6、既有客户的档案和已有预约没有被改动。\n7、期望处理：回答；客户有异议时人工承接；没有创建预约，没有登记候补，没有向范围外的新来电者报价、建档或发送 intake 表链接。；范围判断对应来电者最后确认的地址。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G14 上门地址不在服务范围内\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/book-mobile-grooming/address-is-outside-service-area.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：回答；客户有异议时人工承接"}, {"name": "标签", "old": "", "new": "story:G14,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r15", "row": 15, "name": "检查 G15 客户想预约门店不开放自助的服务", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Staff scheduled", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c4794f82f27", "fp": "a8d9b7e1ce03", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G15 客户想预约门店不开放自助的服务"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Staff scheduled"}, {"name": "前置条件", "old": "", "new": "客户要预约的服务在门店存在，但不开放自助预约；来电在转人工窗口内，员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：尽早知道这件事要交给员工，并把我的需求一次说清、交到对的人手里\n3、认出这类服务：能确定客户要的服务属于这一类时，告诉客户这项服务由员工安排。认出后就可以告诉客户，不必再走查空位、选时间的流程；说得早是体验上的期望，不决定对错。\n4、说法准确：说的是“这项服务需要员工来安排”，不说成门店不提供这项服务，也不说成没有空位。\n5、收集最少的可行动信息：哪只宠物、想做什么、希望的日期或时间范围、其他会影响安排的要求。已经知道的不重复问；客户不愿多说时不强求。\n6、人工承接：征得同意后转接员工，并让员工拿到上面的信息。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、没有创建这项服务的预约，也没有用另一项服务顶替。\n4、员工接手时或 follow-up 中，有宠物、服务和时间偏好这些可行动的信息。\n5、同一件事没有重复的 follow-up。\n6、接通或留言没有被记成预约成功。\n7、期望处理：人工承接；没有创建这项服务的预约，也没有用另一项服务顶替。；员工接手时或 follow-up 中，有宠物、服务和时间偏好这些可行动的信息。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G15 客户想预约门店不开放自助的服务\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/request-staff-scheduled-service/customer-requests-service-staff-must-schedule.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接"}, {"name": "标签", "old": "", "new": "story:G15,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r16", "row": 16, "name": "检查 G17 客户查询 Boarding / Daycare 预约", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cfca47e203f", "fp": "23d761d75690", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G17 客户查询 Boarding / Daycare 预约"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；客户问的预约能唯一确定，且尚未开始；没有触发任何条件 Story。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：核对这笔预约：还在不在、是哪只宠物、哪几天、几点送几点接\n3、识别客户：用来电号码确定客户档案。\n4、确定是哪一笔预约：查的是客户名下当前的预约，今天的也在内。客户有多笔预约时，按宠物、服务和日期确定客户问的是哪一笔；仍有歧义时请客户补充一个容易说清的信息，不猜，也不要求客户提供内部编号。\n5、说明当前信息：按业务系统当前的记录说明：这笔预约在不在、现在是否仍然有效、是哪只宠物、什么服务。Boarding 说明 drop-off 和 pick-up 的日期；Daycare 说明是哪一天或哪几天。记在这笔预约上的其他信息，客户问到…\n6、只读：“帮我确认一下”只表示查询。查询不改动预约，也不因为客户问起就重新创建、重新确认或调整任何内容。客户没有别的事时自然结束。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、披露的信息属于正确的客户，对象是正确的预约，内容与业务系统当前的记录一致。\n4、今天的预约查得到。\n5、没有把另一笔预约、另一只宠物的预约混进来，也没有把已取消或已结束的预约说成仍然有效。\n6、预约没有任何改动，没有新增预约，客户和宠物的资料没有变化。\n7、期望处理：自助完成；披露的信息属于正确的客户，对象是正确的预约，内容与业务系统当前的记录一致。；今天的预约查得到。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G17 客户查询 Boarding / Daycare 预约\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/get-appointment-information/customer-checks-boarding-or-daycare-reservation.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：自助完成"}, {"name": "标签", "old": "", "new": "story:G17,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r17", "row": 17, "name": "检查 G18 客户查询 Grooming 预约", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c3820f1b75b", "fp": "b16d5bedb20a", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G18 客户查询 Grooming 预约"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；客户问的预约能唯一确定，且尚未开始；没有触发任何条件 Story。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：打电话核对这笔预约：哪天、几点、哪只宠物、做什么、由谁做\n3、识别客户：用来电号码确定客户档案。\n4、确定是哪一笔预约：客户有多笔未来预约时，按宠物、日期或服务确定客户问的是哪一笔；仍有歧义时请客户澄清，不猜。\n5、说明当前信息：按业务系统当前的记录说明宠物、服务、日期和时间、预约状态，以及已分配的美容师。到店美容的时间是服务开始时间；上门美容说明到达时间段和服务地址。\n6、只读：查询不改动预约，也不因为客户问起就重新确认、重新发送或调整任何内容。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、披露的信息属于来电号码匹配的客户，对象是正确的预约。\n4、预约没有任何改动，没有新增预约、任务或通知。\n5、没有把已取消、已完成或另一只宠物的预约当作答案。\n6、先确定客户和目标预约，再披露详情。\n7、期望处理：自助完成；披露的信息属于来电号码匹配的客户，对象是正确的预约。；预约没有任何改动，没有新增预约、任务或通知。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G18 客户查询 Grooming 预约\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/get-appointment-information/customer-checks-grooming-appointment.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：自助完成"}, {"name": "标签", "old": "", "new": "story:G18,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r18", "row": 18, "name": "检查 G19 客户改期 Boarding / Daycare 预约", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c31192696e5", "fp": "b057b288f1da", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G19 客户改期 Boarding / Daycare 预约"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；要改的预约能唯一确定且尚未开始；业务系统判断这次改期可以由客户自己办（门店的配置允许，或门店没有配置）；新日期不是今天，对预约里的全部宠物和当前服务都可订；没有触发其他条…"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：一次联系就把预约改到门店确实接得下的新日期\n3、确定要改的是哪一笔：按宠物、服务和日期确定目标预约并向客户确认。客户有多笔预约时不猜，也不要求客户提供内部编号。\n4、多宠预约整笔一起改：预约里有多只宠物时，告诉客户这笔预约里有哪些宠物，它们一起移到新的安排。客户只提到其中一只时，问清是整笔一起改还是只改这一只；只改一只的进入 C18。\n5、确认这次改期可以由 Agent 办：以业务系统对这笔预约的判断为准。不允许时进入 C18。\n6、了解新的安排：新的 drop-off 和 pick-up 日期（Daycare 是新的日期）和接送时间。相对日期或容易混淆的说法，换成明确的日期向客户确认。已经知道、没有变化的不重复问。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、只改动了客户确认的那一笔预约，其他预约不受影响。\n4、预约里的宠物、服务、房型和 add-on 完整保留，只有客户确认的日期和时间变了；没有只移动一部分宠物。\n5、改后的安排对全部宠物都是当前真实可订的。\n6、改期是移动同一笔预约，没有新建第二笔，也没有先取消再约；失败时原预约不变。\n7、期望处理：按门店的改约取消配置：允许时自助完成（没有配置时也自助完成），不允许时人工承接；只改动了客户确认的那一笔预约，其他预约不受影响。；预约里的宠物、服务、房型和 add-on 完整保留，只有客户确认的日期和时间变了；没有只移动一部分宠物。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G19 客户改期 Boarding / Daycare 预约\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/reschedule-appointment/customer-reschedules-boarding-or-daycare.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：按门店的改约取消配置：允许时自助完成（没有配置时也自助完成），不允许时人工承接"}, {"name": "标签", "old": "", "new": "story:G19,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r19", "row": 19, "name": "检查 G20 客户改期 Salon Grooming 预约", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c167de88029", "fp": "c01e2637521b", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G20 客户改期 Salon Grooming 预约"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；要改的预约能唯一确定且尚未开始；业务系统判断这次改期门店允许客户自己办；客户接受的范围内有合格美容师的真实空位；没有触发其他条件 Story。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：一次联系就把预约改到一个门店确实能做的新时间\n3、确定要改的是哪一笔：按宠物、日期或服务确定目标预约并向客户确认。客户有多笔预约时不猜。\n4、确认这次改期可以由 Agent 办：以业务系统对这笔预约的判断为准。不允许时进入 C18。\n5、了解新的时间：希望改到的日期或时间范围，是否要原来的美容师。已经知道的不重复问。\n6、提供真实的新时间：按与新建预约相同的标准核查：服务仍适用，美容师有资格做这项服务，完整时长放得进去，在营业时间内、不在闭店日（G07）。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、只改动了客户确认的那一笔预约，其他预约和宠物不受影响。\n4、改后的时间是当前真实空位，美容师有资格做这项服务。\n5、改期是移动同一笔预约，没有新建第二笔，也没有先取消再约；失败时原预约不变。\n6、门店的配置不允许时，Agent 没有改动任何预约。\n7、期望处理：门店允许时自助完成；不允许时人工承接；只改动了客户确认的那一笔预约，其他预约和宠物不受影响。；改后的时间是当前真实空位，美容师有资格做这项服务。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G20 客户改期 Salon Grooming 预约\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/reschedule-appointment/customer-reschedules-salon-grooming.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：门店允许时自助完成；不允许时人工承接"}, {"name": "标签", "old": "", "new": "story:G20,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r20", "row": 20, "name": "检查 G21 客户改期 Mobile Grooming 预约", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c5b8bcd70c0", "fp": "6f7d8effae39", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G21 客户改期 Mobile Grooming 预约"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；要改的预约能唯一确定且尚未开始；业务系统判断这次改期商家允许客户自己办；上门地址不变，客户接受的范围内有能到达该地址、覆盖完整服务的真实安排；没有触发其他条件 Story。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：一次联系就把预约改到一个美容师确实能到我家的新时间\n3、确定要改的是哪一笔：按宠物、日期或地址确定目标预约并向客户确认。客户有多笔预约时不猜。\n4、确认这次改期可以由 Agent 办：以业务系统对这笔预约的判断为准。不允许时进入 C18。\n5、了解新的时间：希望改到的日期或时间范围，是否要原来的美容师。已经知道的不重复问。\n6、提供能到达该地址的真实安排：按与新建预约相同的标准核查：美容师、车辆和路线在新的日期和到达时间段排得开（G10）。最早的可约日期较远时如实说明。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、只改动了客户确认的那一笔预约，其他预约和宠物不受影响。\n4、改后的安排是美容师确实能到达该地址的真实安排。\n5、改期是移动同一笔预约，没有新建第二笔，也没有先取消再约；失败时原预约不变。\n6、商家的配置不允许时，Agent 没有改动任何预约。\n7、期望处理：门店允许时自助完成；不允许时人工承接；只改动了客户确认的那一笔预约，其他预约和宠物不受影响。；改后的安排是美容师确实能到达该地址的真实安排。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G21 客户改期 Mobile Grooming 预约\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/reschedule-appointment/customer-reschedules-mobile-grooming.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：门店允许时自助完成；不允许时人工承接"}, {"name": "标签", "old": "", "new": "story:G21,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r21", "row": 21, "name": "检查 G22 客户取消 Boarding / Daycare 预约", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cd57dd362c1", "fp": "7c60fddf914c", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G22 客户取消 Boarding / Daycare 预约"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；要取消的预约能唯一确定且尚未开始；业务系统判断这次取消可以由客户自己办（门店的配置允许，或门店没有配置）；没有触发其他条件 Story。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：一次联系就把要取消的那一笔取消掉\n3、确定要取消的是哪一笔：按宠物、服务和日期确定目标预约并向客户确认。客户有多笔预约时不猜，也不要求客户提供内部编号。多宠预约要弄清是整笔取消还是只取消其中一只；客户先说出一只宠物的名字，不等于只取消这一只，也不等于整笔取消。\n4、确认这次取消可以由 Agent 办：以业务系统对这笔预约的判断为准。不允许时进入 C18。\n5、不把说明原因当作前提：可以简短地问一句原因；客户不说也照常取消。客户说了原因时照他的原话记下。\n6、取消前问一次要不要改期：客户愿意改期时进入改期（G19），原预约不取消。客户不要时立即继续取消，不再劝说，也不把取消改成改期。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、只取消了客户确认的那一笔预约，其他预约和宠物不受影响。\n4、多宠预约没有因为客户只想取消一只而被整笔取消，也没有取消客户要保留的宠物。\n5、门店的配置不允许时，Agent 没有取消或改动任何预约。\n6、有业务系统的成功结果，才告知已取消；没有重复取消。\n7、期望处理：按门店的改约取消配置：允许时自助完成（没有配置时也自助完成），不允许时人工承接；只取消了客户确认的那一笔预约，其他预约和宠物不受影响。；多宠预约没有因为客户只想取消一只而被整笔取消，也没有取消客户要保留的宠物。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G22 客户取消 Boarding / Daycare 预约\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/cancel-appointment/customer-cancels-boarding-or-daycare.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：按门店的改约取消配置：允许时自助完成（没有配置时也自助完成），不允许时人工承接"}, {"name": "标签", "old": "", "new": "story:G22,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r22", "row": 22, "name": "检查 G23 客户取消 Grooming 预约", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c3de906a659", "fp": "ae9e27175038", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G23 客户取消 Grooming 预约"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；要取消的预约能唯一确定且尚未开始；业务系统判断这次取消门店允许客户自己办；没有触发其他条件 Story。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：一次联系就把要取消的那一笔取消掉\n3、确定要取消的是哪一笔：按宠物、日期或服务确定目标预约并向客户确认。客户有多笔预约时不猜；多宠预约要弄清是全部取消还是只取消其中一只。\n4、确认这次取消可以由 Agent 办：以业务系统对这笔预约的判断为准。不允许时进入 C18。\n5、取消前问一次要不要改期：客户愿意改期时进入改期（G20、G21），原预约不取消。客户不要时继续取消，不再问，不挽留。\n6、回顾并确认：回顾要取消的是哪一笔，客户明确同意后才取消。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、只取消了客户确认的那一笔预约，其他预约和宠物不受影响。\n4、门店的配置不允许时，Agent 没有取消或改动任何预约。\n5、有业务系统的成功结果，才告知已取消；没有重复取消。\n6、Agent 没有计算或收取任何费用。\n7、期望处理：门店允许时自助完成；不允许时人工承接；只取消了客户确认的那一笔预约，其他预约和宠物不受影响。；门店的配置不允许时，Agent 没有取消或改动任何预约。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G23 客户取消 Grooming 预约\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/cancel-appointment/customer-cancels-grooming.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：门店允许时自助完成；不允许时人工承接"}, {"name": "标签", "old": "", "new": "story:G23,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r23", "row": 23, "name": "检查 G49 客户回复提醒或发来确认", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c519ccfe009", "fp": "0e06b96363b2", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G49 客户回复提醒或发来确认"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment"}, {"name": "前置条件", "old": "", "new": "客户的短信是对预约提醒的回复，或一句单纯的确认，例如 “C”“OK”“See you Friday”；没有带别的请求。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 短信会话\n2、客户提出请求：回一个“C”或一句“周五见”就算告诉门店了\n3、认出这是确认：不把它当成一个新的预约、改期或咨询请求。\n4、把预约标成已确认：标的是客户确认的那一笔：回复提醒，确认的就是这条提醒说的那笔预约。业务系统返回成功才算标上。\n5、收下并记录：这条确认记在这段会话的记录里，门店查得到。\n6、不留待办：确认不进门店等着处理的清单。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、客户确认的那笔预约标成了已确认，以业务系统返回的成功结果为准；标的不是别的预约。\n4、确认记进了这段会话的记录。\n5、预约标不上时，确认仍在会话记录里，标明留给门店看；这段会话不暂停。\n6、没有因为一条确认留下待办，标不上时也一样。\n7、期望处理：自助完成；预约标不上时留给店里看；客户确认的那笔预约标成了已确认，以业务系统返回的成功结果为准；标的不是别的预约。；确认记进了这段会话的记录。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G49 客户回复提醒或发来确认\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/confirm-appointment/customer-confirms-appointment-by-text.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：自助完成；预约标不上时留给店里看"}, {"name": "标签", "old": "", "new": "story:G49,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r24", "row": 24, "name": "检查 G24 客户询问在店宠物的情况", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c458417a748", "fp": "de7ada6cb79d", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G24 客户询问在店宠物的情况"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；客户有一只宠物当前已入住或在日托中；来电在转人工窗口内，员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：知道它现在怎么样\n3、确定是哪只宠物、哪一次服务：用预约记录确定客户问的宠物、门店和当前进行中的服务。不把未来的预约、已结束的服务或另一只宠物混进来。\n4、不猜测现场情况：预约记录只说明计划，不说明宠物此刻的状态。Agent 不根据当前时间、预约进度或一般经验说宠物“很好”“吃了”“睡了”。\n5、弄清客户想知道什么：客户只是想听听近况时不追问；客户有具体关心的事（进食、用药、情绪、和其他狗相处）时记下来，让员工有针对性地回答。\n6、人工承接：告诉客户将连接能看到现场的员工，征得同意后转接，并让员工拿到客户、宠物、当前服务和客户关心的问题。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、查询关联到正确的客户、宠物、门店和进行中的服务。\n4、当前服务没有被改动。\n5、员工实际接手了一份包含宠物和问题的上下文，或 follow-up 实际留下。\n6、没有形成任何关于宠物状态的业务结论。\n7、期望处理：人工承接；查询关联到正确的客户、宠物、门店和进行中的服务。；当前服务没有被改动。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G24 客户询问在店宠物的情况\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/get-in-progress-service-information/customer-asks-how-pet-is-doing.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接"}, {"name": "标签", "old": "", "new": "story:G24,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r25", "row": 25, "name": "检查 G25 客户询问宠物是否可以接了", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cb93e4bfd41", "fp": "6087bd496b97", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G25 客户询问宠物是否可以接了"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；客户有一只宠物今天在门店接受服务；来电在转人工窗口内，员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：知道它做完了没有、我现在能不能去接\n3、确定是哪只宠物、哪一次服务：用预约记录确定客户问的宠物和今天的服务。\n4、不推算完成时间：Agent 不根据服务开始时间、服务名称、一般时长或当前时间说“应该快好了”“大概几点能接”。\n5、可以说明已配置的安排：门店配置了接宠安排和通知方式时（例如做完后会通知），可以告诉客户，并说明这是一般安排，不代表这只宠物现在的进度。\n6、人工承接：告诉客户将连接能看到现场的员工，征得同意后转接，并让员工拿到客户、宠物、今天的服务和“是否可以接”这个问题。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、查询关联到正确的客户、宠物和今天的服务。\n4、今天的服务没有被改动、提前结束或标记为完成。\n5、员工实际接手，或 follow-up 实际留下并标明时间敏感。\n6、没有形成“宠物已准备好”的业务结论。\n7、期望处理：人工承接；查询关联到正确的客户、宠物和今天的服务。；今天的服务没有被改动、提前结束或标记为完成。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G25 客户询问宠物是否可以接了\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/get-in-progress-service-information/customer-asks-whether-pet-is-ready.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接"}, {"name": "标签", "old": "", "new": "story:G25,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r26", "row": 26, "name": "检查 G26 客户请求延长在店服务", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "ca99afed49d", "fp": "f6fe15b70bf0", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G26 客户请求延长在店服务"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；客户有一只宠物当前已经入住或在日托中；来电在转人工窗口内，员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：把“让它多留一阵”的请求交到能看到现场安排的员工手里\n3、确定是哪只宠物、哪一次服务：用预约记录核对宠物、门店和原定的 pick-up 日期，确认客户说的是现在在店的这一次，不是另一笔未来的或已经结束的预约。\n4、弄清想延到什么时候：记下新的期望 pick-up 日期、客户说的原因，以及客户想马上让门店知道的照护信息。客户已经说清的不重复问。\n5、说明由门店决定：告诉客户，因为宠物已经在店，延长要由门店的员工确认。不说新日期已经留好、价格已经确定或已经延好；不把延长的那一段另建成一笔新预约。\n6、人工承接：征得客户同意后转接，并让员工拿到客户、宠物、当前的服务、原定和期望的 pick-up 日期、客户说的原因。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、请求关联到正确的客户、宠物、门店和正在进行的服务。\n4、正在进行的服务没有被 Agent 改动；没有按普通的未来预约改期来处理。\n5、没有新建一笔与当前入住重叠的预约。\n6、员工确认之前，Agent 没有承诺空位、价格或延长结果。\n7、期望处理：人工承接；请求关联到正确的客户、宠物、门店和正在进行的服务。；正在进行的服务没有被 Agent 改动；没有按普通的未来预约改期来处理。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G26 客户请求延长在店服务\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/modify-in-progress-service/customer-requests-stay-extension.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接"}, {"name": "标签", "old": "", "new": "story:G26,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r27", "row": 27, "name": "检查 G27 客户请求提前接宠或缩短在店服务", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c815dd3c253", "fp": "cadb12ccc16b", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G27 客户请求提前接宠或缩短在店服务"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；客户有一只宠物当前已入住或在日托中；来电在转人工窗口内，员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：告诉门店我想比原计划早一点接它，或者让它提前几天离店\n3、确定是哪只宠物、哪一次服务：用预约记录确定客户说的宠物、当前进行中的服务和原定的接宠安排。不把未来的预约、已结束的服务或另一只宠物混进来。\n4、弄清客户想怎么改：希望提前到哪一天、大概几点来接。客户只说“想早一点”时不强求准确时间；客户主动说的原因记下来。已经说过的不重复问。\n5、说明这件事由门店决定：宠物已经在店，能不能提前接要由看得到现场的员工确认。Agent 不改动这笔预约，不说“可以，您几点来就行”，不根据预约进度或一般经验说宠物到时已经准备好，也不说费用会不会变。\n6、人工承接：告诉客户将连接能决定这件事的员工，征得同意后转接，并让员工拿到客户、宠物、当前服务、原定的接宠安排、客户希望的新时间和他说的原因。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、请求关联到正确的客户、宠物、门店和进行中的服务。\n4、进行中的服务没有被 Agent 改动、缩短、取消或标记为结束。\n5、员工实际接手了一份包含原定安排和客户希望的新时间的上下文，或 follow-up 实际留下。\n6、没有形成“提前接宠已获同意”或“宠物已准备好”的业务结论。\n7、期望处理：人工承接；请求关联到正确的客户、宠物、门店和进行中的服务。；进行中的服务没有被 Agent 改动、缩短、取消或标记为结束。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G27 客户请求提前接宠或缩短在店服务\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/modify-in-progress-service/customer-requests-early-pickup.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接"}, {"name": "标签", "old": "", "new": "story:G27,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r28", "row": 28, "name": "检查 G28 客户更新喂食、用药等照护说明", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cef8c0e5328", "fp": "556029c9dd7e", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G28 客户更新喂食、用药等照护说明"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；客户的宠物今天在门店，已入住或在日托中；来电在转人工窗口内，员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：把新的喂食、用药或其他照护要求告诉门店\n3、确定是哪只宠物、哪一次服务：用预约记录确定客户说的宠物和当前的服务。多只宠物时不猜，指代不清先澄清。\n4、听清客户要改什么：喂什么、喂多少、什么时候喂；用什么药、怎么给；或其他照护要求。按客户的原话记下，不改写，不补全客户没有说的内容。\n5、不给医疗或用药建议：不评价剂量对不对，不回答漏了一次要不要补、药能不能和饭一起给这类问题，也不判断宠物这种情况还能不能继续接受服务。客户问到时，告诉他这些由门店的员工回答。\n6、人工承接：征得同意后转接，并让员工拿到客户、宠物、当前的服务、客户原话的说明和回电号码。说的是今天在店宠物的用药时，标明紧急。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、说明关联到正确的客户、宠物和服务。\n4、员工接手时或 follow-up 中，有客户原话的说明和回电号码；涉及今天在店宠物用药的标明了紧急。\n5、交接内容里没有 Agent 改写或补写的药名、剂量和做法。\n6、没有形成“照护说明已经更新”或“员工已经照做”的业务结论。\n7、期望处理：人工承接；说明关联到正确的客户、宠物和服务。；员工接手时或 follow-up 中，有客户原话的说明和回电号码；涉及今天在店宠物用药的标明了紧急。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G28 客户更新喂食、用药等照护说明\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/modify-in-progress-service/customer-updates-care-instructions.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接"}, {"name": "标签", "old": "", "new": "story:G28,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r29", "row": 29, "name": "检查 G29 客户通知到店时间、迟到或当天改时间", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cabf647e276", "fp": "814fc0aa2d70", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G29 客户通知到店时间、迟到或当天改时间"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；今天的预约能唯一确定；客户只是预告到达时间，且时间在门店配置的窗口内；来电在营业时间内。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：打个电话告诉门店我几点到、会晚一点，或者想把今天的送宠、接宠时间挪一挪\n3、确定是今天的哪一笔预约：按宠物和服务确定，并向客户确认。\n4、听清并回顾客户说的时间：是送宠还是接宠、大概几点。\n5、送达门店：把预约、宠物和客户说的时间交给门店。\n6、说明效力：信息实际送达后，告诉客户已经转达给门店。预告不改变预约本身。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、门店收到的信息包含正确的客户、宠物、今天的预约和客户说的时间。\n4、信息在仍然有用的时候到达门店；做不到时客户被如实告知。\n5、预约本身没有被 Agent 改动。\n6、同一件事只送达一次，客户重复询问不产生重复的信息。\n7、期望处理：转达；需要门店同意的人工承接；门店收到的信息包含正确的客户、宠物、今天的预约和客户说的时间。；信息在仍然有用的时候到达门店；做不到时客户被如实告知。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G29 客户通知到店时间、迟到或当天改时间\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/coordinate-day-of-visit/customer-gives-arrival-or-late-notice.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：转达；需要门店同意的人工承接"}, {"name": "标签", "old": "", "new": "story:G29,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r30", "row": 30, "name": "检查 G30 客户询问上门美容师的到达时间", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c0cb8fd98cf", "fp": "148476570c3c", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G30 客户询问上门美容师的到达时间"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；客户今天有一笔上门美容预约；预约的到达时间段还没有过；来电在转人工窗口内，员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：知道美容师什么时候到，或者为什么还没到\n3、确定今天的预约：按宠物和地址确定，并向客户确认。\n4、说明预约上的到达时间段：告诉客户记录上的到达时间段，并说明这是计划的安排，不是美容师现在的位置。\n5、不估计实时到达时间：Agent 不说“应该快到了”“大概还有二十分钟”。\n6、客户需要更具体的答复时人工承接：征得同意后转接员工，并让员工拿到客户、地址、预约的到达时间段和客户的问题。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、查询关联到正确的客户、地址和今天的预约。\n4、预约没有被 Agent 改动。\n5、人工承接时，员工拿到客户、地址、到达时间段和问题；到达时间段已过的标明紧急。\n6、同一次等待的多通来电汇总在同一条请求上。\n7、期望处理：人工承接；查询关联到正确的客户、地址和今天的预约。；预约没有被 Agent 改动。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G30 客户询问上门美容师的到达时间\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/coordinate-day-of-visit/customer-asks-where-mobile-groomer-is.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接"}, {"name": "标签", "old": "", "new": "story:G30,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r31", "row": 31, "name": "检查 G31 客户到店但无法联系到员工", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c02fabd7390", "fp": "2fc3dd1eb7c6", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G31 客户到店但无法联系到员工"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；客户今天在这家门店有预约，或有宠物在店；客户已经到店，门锁着或没有人回应；来电在转人工窗口内，员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：把“我现在就在门口”这件事马上交到能处理的员工手里\n3、认出这是正在发生的到店问题：客户已经在现场、送不了或接不了宠物。不把它当成询问营业时间、地址或未来的预约。\n4、确认最少的事实：客户和宠物、哪一家门店、今天对应的服务、是来送还是来接、原定的时间、现场受阻的情况（门锁着、门铃没有人应、电话没有人接），以及门店可以联系客户的号码。客户已经说清的不重复问，不为了这次协助重新收集一遍预约资料。\n5、只说能确认的：可以说明门店配置的营业时间和这笔预约的安排，但不据此断定现场一定有人，也不把客户的话改写成“门店还没开”“您来早了”。没有员工确认时，不说员工在哪里、为什么没有回应、门什么时候开、有没有人正在赶来、还要等多久、宠物在哪里或怎…\n6、人工承接：告诉客户将连接门店的员工，征得同意后转接，并让员工拿到第 2 步的内容，标明时间敏感。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、问题关联到正确的客户、宠物、门店和今天的服务。\n4、员工接手时或 follow-up 中，有客户已经到店、到店目的、原定时间、现场受阻的情况、回电号码和时间敏感的标记。\n5、没有从营业时间推断现场的状态；没有记下客户没有说、门店没有确认的事实。\n6、没有接通的转接没有被说成员工已经接手。\n7、期望处理：人工承接；短信留给店里看；问题关联到正确的客户、宠物、门店和今天的服务。；员工接手时或 follow-up 中，有客户已经到店、到店目的、原定时间、现场受阻的情况、回电号码和时间敏感的标记。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G31 客户到店但无法联系到员工\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/resolve-on-site-access-issue/customer-arrives-but-cannot-reach-staff.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接；短信留给店里看"}, {"name": "标签", "old": "", "new": "story:G31,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r32", "row": 32, "name": "检查 G50 客户发短信给上门的美容师留话", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c1e2c159318", "fp": "531ff9d38d3f", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G50 客户发短信给上门的美容师留话"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/03 Day of visit"}, {"name": "前置条件", "old": "", "new": "客户有一笔当天或临近的上门美容预约；发来的话是写给美容师的现场说明，不需要商家作决定，也不是一个请求。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 短信会话\n2、客户提出请求：把“门没锁，直接进”“狗在后院”这样的话发到商家的号码，美容师就能看到\n3、认出这是写给美容师的话：例如怎么进门、宠物在哪里、停车位置、到了发个消息。\n4、不回复：Agent 不代美容师答复，也不确认“美容师已经知道了”。\n5、留给美容师：消息留在商家的短信里，标明留给店里看；不留待办。\n6、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、Agent 没有回复这条消息。\n4、消息留在商家的短信里，标明留给店里看；没有留下待办。\n5、没有因为这条消息改动预约或档案。\n6、期望处理：留给店里看；Agent 没有回复这条消息。；消息留在商家的短信里，标明留给店里看；没有留下待办。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G50 客户发短信给上门的美容师留话\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/coordinate-day-of-visit/customer-texts-note-for-mobile-groomer.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：留给店里看"}, {"name": "标签", "old": "", "new": "story:G50,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r33", "row": 33, "name": "检查 G32 来电者询问服务内容与是否适用", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/04 Inquiry", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cf06fc6efb1", "fp": "b82ea9888af0", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G32 来电者询问服务内容与是否适用"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/04 Inquiry"}, {"name": "前置条件", "old": "", "new": "来电者问的服务门店有；服务的说明和适用条件在门店的设置里明确；问题能按一般规则回答，不需要员工对这只宠物作判断。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：不用先登记，就能了解门店有哪些服务、每项服务包含什么，以及我的宠物这类情况门店接不接\n3、不以建档为前提：回答不要求先识别身份或建立档案。来电号码没有匹配到档案，不说明来电者是新客户，也不表示他同意建档。\n4、弄清问的是什么：哪项服务、想知道内容还是能不能做。答案取决于体型、物种、绝育状态这类宠物特征时，只问用得上的那几项；已经说过的不重复问。\n5、按门店的设置回答：服务包含什么以门店的服务说明为准，不凭服务名称推断。门店接不接这类宠物、有什么限制，按门店当前的设置说。\n6、把资格和限制分开说：能接待不等于适合所有房型或活动。某个特征只影响一部分安排时（例如未绝育只影响集体活动），说清影响的是哪一部分。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、答复与门店当前的设置一致；没有 Agent 编出来的服务内容、接待范围或限制。\n4、没有把一般规则说成对这只宠物、某个房型、某个日期或某项活动的保证。\n5、Agent 没有判断一只有健康问题、术后情况或攻击记录的宠物能不能接待。\n6、只咨询的通话没有创建或更新档案，没有创建预约、候补，也没有不必要的 follow-up。\n7、期望处理：回答；答复与门店当前的设置一致；没有 Agent 编出来的服务内容、接待范围或限制。；没有把一般规则说成对这只宠物、某个房型、某个日期或某项活动的保证。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G32 来电者询问服务内容与是否适用\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/answer-business-information/caller-asks-about-services-and-fit.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：回答"}, {"name": "标签", "old": "", "new": "story:G32,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r34", "row": 34, "name": "检查 G35 来电者询问营业时间与闭店日", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/04 Inquiry", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c6b2cd6e01d", "fp": "bdd3851ba96a", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G35 来电者询问营业时间与闭店日"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/04 Inquiry"}, {"name": "前置条件", "old": "", "new": "门店在 MoeGo 里设置了营业时间和闭店日；来电者问的那一天能确定。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：马上得到某一天开不开门、几点到几点的准确答复，门店已经下班时也一样\n3、直接回答：回答不要求先识别身份或建立档案。\n4、确定问的是哪一天：今天、某个具体的日期，还是平常的营业时间。已经说清的不再问。\n5、按门店的设置回答：那一天开不开门、几点到几点；是闭店日时如实说。不拿别的日期的时间来回答。\n6、把营业时间和接送时间分开：门店开着门，不等于这段时间都能送宠或接宠。来电者真正关心的是几点能送、几点能接时，按 G36 回答。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、答复与门店当前设置的营业时间和闭店日一致。\n4、没有把别的日期的营业时间当作答案；设置里没有的，没有 Agent 推测的答复。\n5、没有 Agent 自行答应的营业时间外安排或破例。\n6、只询问营业时间的通话没有创建或更新档案，没有创建或改动预约，也没有不必要的 follow-up。\n7、期望处理：回答；答复与门店当前设置的营业时间和闭店日一致。；没有把别的日期的营业时间当作答案；设置里没有的，没有 Agent 推测的答复。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G35 来电者询问营业时间与闭店日\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/answer-business-information/caller-asks-about-hours.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：回答"}, {"name": "标签", "old": "", "new": "story:G35,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r35", "row": 35, "name": "检查 G36 来电者询问送宠、接宠安排与迟接费用", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/04 Inquiry", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cd6e357ee6e", "fp": "d7399aca45fb", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G36 来电者询问送宠、接宠安排与迟接费用"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/04 Inquiry"}, {"name": "前置条件", "old": "", "new": "来电者想了解规则，不是在通知或改动今天的安排；问的服务和日期能确定，那一天不是闭店日；门店的设置里有这项服务的送宠、接宠时间，问到迟接费用时也有相应的规则。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：知道这项服务在那一天几点到几点可以送、可以接，以及接晚了会不会收费\n3、不以建档为前提：回答不要求先识别身份或建立档案。\n4、弄清问的范围：哪项服务、哪一天、送宠还是接宠。已经说清的不重复问；不拿另一项服务或另一天的规则来回答。\n5、按门店的设置回答时间：说明这项服务在那一天可以送宠、接宠的时间。\n6、把营业时间和接送时间分开：门店开着门，不等于这段时间都能送宠或接宠；也不把接送时间说成门店的全部营业时间。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、说明的时间和迟接费用规则与门店当前的设置一致。\n4、没有混用其他服务或其他日期的时间和费用规则。\n5、没有 Agent 算出来的迟接费用，没有 Agent 答应的免除或宽限；门店没有设置时没有被说成不收费。\n6、只咨询的通话没有创建、修改或取消预约，没有产生费用，没有创建或更新档案，也没有不必要的 follow-up。\n7、期望处理：回答；说明的时间和迟接费用规则与门店当前的设置一致。；没有混用其他服务或其他日期的时间和费用规则。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G36 来电者询问送宠、接宠安排与迟接费用\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/answer-business-information/caller-asks-about-drop-off-and-pick-up.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：回答"}, {"name": "标签", "old": "", "new": "story:G36,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r36", "row": 36, "name": "检查 G37 来电者询问 Boarding / Daycare 价格", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/04 Inquiry", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c7d1e677949", "fp": "d20a12d7c0b3", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G37 来电者询问 Boarding / Daycare 价格"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/04 Inquiry"}, {"name": "前置条件", "old": "", "new": "来电者问的是 Boarding 或 Daycare；宠物、日期和服务能说清；业务系统为这只宠物、这一单返回了有效的价格。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：不用先登记、也不用先预约，就得到针对我的宠物和这几天的一个估价，或者被明确告知这个价格需要员工确认\n3、不以建档为前提：询价不要求先识别身份或建立档案，也不要求先预约。有档案且来电者问的是档案里的宠物时，直接使用已有资料。\n4、弄清报价的范围：哪只或哪几只宠物、哪几天、哪项服务，以及会影响价格的其他选择。只问还缺的；不把来电者的其他宠物或其他日期自动算进来。\n5、缺品种或体重先问：报价用得上而还不知道时，先问清楚，再取价。\n6、只报业务系统返回的价：不沿用历史订单、其他宠物、其他服务或其他日期的价格；不自行估算、折算，也不答应业务系统没有返回的优惠。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、报出的价格与业务系统为这只宠物、这一单返回的一致。\n4、没有 Agent 自行估算、折算或承诺的价格和优惠；没有把估价说成实收或锁定的价格。\n5、报价只覆盖来电者指定的宠物、日期和服务。\n6、只询价的通话没有创建或更新档案，没有创建或修改预约、候补，没有产生收费，也没有不必要的 follow-up。\n7、期望处理：回答；报出的价格与业务系统为这只宠物、这一单返回的一致。；没有 Agent 自行估算、折算或承诺的价格和优惠；没有把估价说成实收或锁定的价格。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G37 来电者询问 Boarding / Daycare 价格\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/get-price-estimate/caller-asks-boarding-or-daycare-price.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：回答"}, {"name": "标签", "old": "", "new": "story:G37,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r37", "row": 37, "name": "检查 G38 来电者询问 Grooming 价格", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/04 Inquiry", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cc715bc6f13", "fp": "63e565c4c91c", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G38 来电者询问 Grooming 价格"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/04 Inquiry"}, {"name": "前置条件", "old": "", "new": "来电者问的服务能对应到门店的一项具体服务；这项服务的价格和计价条件在门店配置中明确；来电者提供的信息足以确定适用的价格。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：不用先登记就能得到一个针对我的宠物的价格，或者被明确告知这个价格需要员工确认\n3、不以建档为前提：询价不要求先识别身份或建立档案。有档案且来电者问的是档案里的宠物时，直接使用已有资料。\n4、上门美容先查服务范围：上门美容报价之前，先问地址并确认在服务范围内；不在范围内时不报价（G14）。\n5、弄清问的是哪项服务：来电者的说法不能明确对应一项服务时先澄清，不拿相近的服务报价。\n6、只收集报价需要的信息：价格取决于品种、体重、毛型等条件时，只问这项服务的计价实际用到的那几项。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、报出的价格与门店配置中这项服务、这些条件下的价格一致。\n4、没有 Agent 自行估算、折算或承诺的价格和优惠。\n5、只询价的通话没有创建或更新档案，没有创建预约、候补，也没有不必要的 follow-up。\n6、需要员工确认时，员工拿到宠物条件、所问服务和来电者的联系方式。\n7、期望处理：回答；需要员工确认的收费人工承接；报出的价格与门店配置中这项服务、这些条件下的价格一致。；没有 Agent 自行估算、折算或承诺的价格和优惠。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G38 来电者询问 Grooming 价格\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/get-price-estimate/caller-asks-grooming-price.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：回答；需要员工确认的收费人工承接"}, {"name": "标签", "old": "", "new": "story:G38,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r38", "row": 38, "name": "检查 G41 客户希望付款", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c2bf090ed46", "fp": "15689442b87b", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G41 客户希望付款"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；来电在转人工窗口内，员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：立刻知道这件事由门店的人来办，并且我的请求已经交到他们手里\n3、认出这是付款的事：付款、提前付款、补小费、要付款链接、更新支付卡、退款，都是这一类。\n4、说明不在这里处理：告诉客户付款由门店的员工处理，Agent 不收卡号，也不发付款链接。\n5、客户开始报卡号时及时打断：礼貌地请客户不要继续说，不复述、不确认、不记录已经听到的片段。\n6、弄清是哪一笔：客户愿意说时，记下是哪一笔服务或账单、想做什么；不强求。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、Agent 没有索取、复述或保存卡号、安全码或有效期；交接内容里也没有。\n4、Agent 没有处理付款、退款，没有发送付款链接，没有说成已经付款。\n5、员工接手时或待办中，有客户、哪一笔和想做什么。\n6、员工实际接手或待办实际留下后，才告知已交给门店。\n7、期望处理：人工承接，并明确告知不处理付款；Agent 没有索取、复述或保存卡号、安全码或有效期；交接内容里也没有。；Agent 没有处理付款、退款，没有发送付款链接，没有说成已经付款。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G41 客户希望付款\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/make-payment/customer-wants-to-pay.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接，并明确告知不处理付款"}, {"name": "标签", "old": "", "new": "story:G41,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r39", "row": 39, "name": "检查 G51 客户在短信里要改资料或发来图片", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cb3ad8c9c8b", "fp": "6790f4850860", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G51 客户在短信里要改资料或发来图片"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff"}, {"name": "前置条件", "old": "", "new": "发短信的号码匹配到客户档案。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 短信会话\n2、客户提出请求：把新地址、名字的写法或一张疫苗记录的照片直接发到门店的号码\n3、认出这是改资料或图片：改地址、补姓名或改拼写、新建一只宠物；或发来图片，例如疫苗记录、宠物的照片。\n4、不改，不判断：Agent 不修改档案，不新建宠物。对图片不说“收到了您的狂犬疫苗记录”“记录有效”这类判断内容的话。\n5、交给门店：留一条待办：客户、宠物、要改什么或发来了什么。\n6、如实说明：待办实际留下后，告诉客户已经交给门店处理；资料还没有改，疫苗记录要门店审核后才算数。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、Agent 没有修改客户或宠物的资料，没有新建宠物档案。\n4、没有把客户发来的图片记为或说成合格的疫苗记录。\n5、待办实际留下，写明要改什么或发来了什么。\n6、待办实际留下后，才告知已交给门店。\n7、期望处理：人工承接；Agent 没有修改客户或宠物的资料，没有新建宠物档案。；没有把客户发来的图片记为或说成合格的疫苗记录。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G51 客户在短信里要改资料或发来图片\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/update-customer-record/customer-asks-to-update-record-or-sends-image-by-text.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接"}, {"name": "标签", "old": "", "new": "story:G51,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r40", "row": 40, "name": "检查 G42 来电者直接要求找员工", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c00b191c6e9", "fp": "1a76e1ca35ab", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G42 来电者直接要求找员工"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff"}, {"name": "前置条件", "old": "", "new": "来电者明确要找人，没有说明具体事项；来电在门店支持转接的时间内；有员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：Agent 尊重这个请求，把我连接给合适的员工\n3、认出这是找人的请求：“前台”“人工”“operator”“representative”“我想和真人说话”都是同一个请求。\n4、先问一次来意：Agent 礼貌地问一次是什么事，用来判断能不能当场办、选对接听的人、让员工有所准备。来电者不愿说时不再追问，也不要求先完成预约、咨询或其他自助流程。\n5、说明并取得同意：告诉来电者将连接给哪类员工，征得同意后转接。\n6、如实说明结果：可以说正在连接。只有电话系统明确表明员工已接手，才能说已接通；响铃、等待提示都不算。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、转接对象符合门店当前的安排和来电者已表达的需求。\n4、只有电话系统的结果表明员工接手，才算转接成功。\n5、没有因为找人而创建、修改或取消预约，也没有为首次来电者建档。\n6、员工接手时能看到来电者已经说过的来意。\n7、期望处理：人工承接；转接对象符合门店当前的安排和来电者已表达的需求。；只有电话系统的结果表明员工接手，才算转接成功。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G42 来电者直接要求找员工\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/connect-to-staff/caller-requests-front-desk.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接"}, {"name": "标签", "old": "", "new": "story:G42,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r41", "row": 41, "name": "检查 G43 来电者回拨门店此前的来电", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c1623b605e9", "fp": "74ec604e289d", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G43 来电者回拨门店此前的来电"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff"}, {"name": "前置条件", "old": "", "new": "来电者说明自己在回拨门店的来电，不知道门店为什么联系他；来电在转人工窗口内，员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：只说一句“我在回你们的电话”，就能被连接给能处理这件事的员工\n3、认出这是回拨：“你们刚才给我打过电话”“我看到一个未接来电”都是同一个请求。不要求来电者先选一个预约、咨询或其他自助流程。\n4、问一次有没有线索：留言里提到的员工、部门或大致是什么事，来电者知道就记下。来电者说不知道时不再追问，也不要求他猜。\n5、不替门店猜原因：不根据客户档案、已有的预约或最近一次服务断定门店为什么来电，也不向来电者透露没有确认过的敏感事项。门店留有可以在这通电话里使用的可靠来电背景时，可以用它选对接听的人。\n6、说明并取得同意：告诉来电者将连接能查看并处理这次回拨的员工，征得同意后转接。交给员工的内容是：来电者在回拨门店的来电，以及他主动提供的线索；原因不明时如实写“原因未知”，不替他编一个主题。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、回拨交给了门店当前安排下适合处理的员工。\n4、来电者主动提供的员工、部门或主题被准确保留；未知的原因没有被猜测或补写。\n5、只有电话系统的结果表明员工接手，才算转接成功。\n6、没有因为一通回拨而创建、修改或取消预约，也没有新建或改动客户、宠物的资料。\n7、期望处理：人工承接；回拨交给了门店当前安排下适合处理的员工。；来电者主动提供的员工、部门或主题被准确保留；未知的原因没有被猜测或补写。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G43 来电者回拨门店此前的来电\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/connect-to-staff/caller-returns-store-call.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接"}, {"name": "标签", "old": "", "new": "story:G43,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r42", "row": 42, "name": "检查 G44 来电者追问此前的请求或没等到的回电", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cbd5a8a26dc", "fp": "33dd17e648f4", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G44 来电者追问此前的请求或没等到的回电"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff"}, {"name": "前置条件", "old": "", "new": "来电者说自己此前留过言或被告知会有人回电，还没有等到；这件事需要员工处理；来电在转人工窗口内，员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：这次不用当成一件新的事从头再办，而是让门店知道我又来问了、问的是哪件事\n3、认出这是追问：“我昨天留了言”“说好给我回电的”“上次那件事怎么样了”都是同一个请求。不当成一件全新的事从头办，也不把来电者推回自助流程。\n4、听清此前请求的是什么：什么事、哪只宠物、大概什么时候提的、当时得到的答复。这些以来电者说的为准；已经说过的不重复问，记不清的不强求。\n5、不猜进展：没有可靠依据时，不说门店已经在处理、已经看到，也不说马上会回电。\n6、人工承接：征得同意后转接，并让员工拿到来电者是谁、哪只宠物、此前请求的内容和时间、这是一次追问、回电号码。来电者没有说的不补写。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、员工接手时，或留给门店的内容里，有此前请求的内容、来电者说的时间、“这是一次追问”和回电号码。\n4、来电者没有提供的信息没有被猜测或补写。\n5、同一件事没有留下重复的 follow-up，也没有多出一条没有背景的请求。\n6、没有因为追问而创建、修改或取消预约；来电者接受由 Agent 当场办的，按对应的目标 Story。\n7、期望处理：人工承接；员工接手时，或留给门店的内容里，有此前请求的内容、来电者说的时间、“这是一次追问”和回电号码。；来电者没有提供的信息没有被猜测或补写。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G44 来电者追问此前的请求或没等到的回电\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/connect-to-staff/caller-chases-earlier-request.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接"}, {"name": "标签", "old": "", "new": "story:G44,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r43", "row": 43, "name": "检查 G46 客户反映服务后宠物的健康或受伤问题", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c8e07d80277", "fp": "1cfac34134ff", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G46 客户反映服务后宠物的健康或受伤问题"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；来电在转人工窗口内，员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：马上把情况告诉门店里能负责的人\n3、认出这是健康的事：客户说宠物在美容、寄养或日托之后受伤、生病、行为异常，或对服务中的处置有担心。\n4、先接住：简短表示知道了、这件事会交给门店，不追问细节来判断严不严重。\n5、不给医疗建议，不认定原因：不说“应该没事”“可能是过敏”，不建议用药或处理办法，也不说是或不是门店造成的。\n6、记下客户已经说的情况：哪只宠物、哪一次服务、客户看到了什么、什么时候发现的。客户没说的不追问到底，也不补写。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、Agent 没有给出医疗、用药方面的建议，没有承诺赔偿或退款。\n4、员工接手时或待办中，有宠物、哪一次服务、客户说的情况、回电号码，并标明紧急。\n5、交接内容里没有 Agent 补写的病情或原因。\n6、交给门店没有被说成问题已经解决。\n7、期望处理：人工承接；Agent 没有给出医疗、用药方面的建议，没有承诺赔偿或退款。；员工接手时或待办中，有宠物、哪一次服务、客户说的情况、回电号码，并标明紧急。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G46 客户反映服务后宠物的健康或受伤问题\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/report-service-issue/customer-reports-pet-health-issue-after-visit.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接"}, {"name": "标签", "old": "", "new": "story:G46,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r44", "row": 44, "name": "检查 G47 客户投诉服务或账单", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c1be2703582", "fp": "4b8b0512d055", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G47 客户投诉服务或账单"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff"}, {"name": "前置条件", "old": "", "new": "来电在转人工窗口内，员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：把不满直接交到门店里能作主的人手里\n3、认出这是投诉：客户对服务结果、员工态度、等待时间、收费不满，要求找经理，或要求退款、补偿。只说“找经理”而不说原因的，也按这里处理。\n4、先接住：简短表示听到了，会交给门店能处理的人。不辩解，不解释门店的做法，不认定谁对谁错。\n5、不作承诺：不承诺退款、补偿、免单或某个处理结果。\n6、记下客户已经说的：对什么不满、哪一次服务、客户希望怎么解决。客户不愿多说时不追问。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、Agent 没有承诺退款、补偿或免单，没有改动账单或预约来“补救”。\n4、员工接手时或待办中，有客户说的要点、涉及的服务和回电号码。\n5、交给门店没有被说成投诉已经解决。\n6、员工实际接手或待办实际留下后，才告知已交给门店。\n7、期望处理：人工承接；Agent 没有承诺退款、补偿或免单，没有改动账单或预约来“补救”。；员工接手时或待办中，有客户说的要点、涉及的服务和回电号码。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G47 客户投诉服务或账单\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/report-service-issue/customer-makes-complaint.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接"}, {"name": "标签", "old": "", "new": "story:G47,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r45", "row": 45, "name": "检查 C01 老客户的来电号码没有匹配到档案", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Caller identity", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "ca51199d2c7", "fp": "127f107659e4", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C01 老客户的来电号码没有匹配到档案"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Caller identity"}, {"name": "前置条件", "old": "", "new": "来电号码的档案查询成功，但没有匹配到任何档案，而来电者表示自己以前来过：换了手机号、用家人或公司的电话打来、登记时留的是另一个号码，或者只是说“我的狗一直在你们这儿”。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：报上姓名和宠物名就能被认出来，接着把事情办了\n3、先弄清是不是新客户：号码没有匹配、且接下来的办理需要客户档案时，在按新客户办理之前，确认来电者以前有没有在这家门店登记过。来电者已经说明来过时不必再问。\n4、按姓名加宠物名找回：来电者表示来过时，请他说出姓名和宠物名，用这两项查找档案。不因为号码没有匹配就直接交给员工。\n5、唯一匹配时确认后继续：只查到一份档案时，用来电者自己说过的姓名和宠物名向他确认，之后按这份档案办理这次的事。找回后的办理权限与号码匹配时相同，包括查询、改约和取消。\n6、查不到或分不清时不猜：没有查到，或查到不止一份而分不清是哪一份时，不挑一份来用，不新建档案，人工承接。交给员工的内容包含来电者自述的姓名、宠物名、可能登记的号码和这次要办的事。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、没有为这位来电者建立重复的客户或宠物档案。\n4、找回时用的是来电者自己说出的姓名和宠物名；确认过程中没有向他披露他没有说出的档案信息。\n5、查到不止一份档案而分不清时，没有任选一份办理。\n6、人工承接时，员工接手时或待办中，有足以找到原档案的信息和这次的需求。\n7、没有为这位来电者建立重复的客户或宠物档案。；找回时用的是来电者自己说出的姓名和宠物名；确认过程中没有向他披露他没有说出的档案信息。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C01 老客户的来电号码没有匹配到档案\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/returning-customer-is-not-recognised.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C01,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r46", "row": 46, "name": "检查 C02 来电者是家庭成员或代办人", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Caller identity", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c38cac9f8fa", "fp": "0c5fd0f459db", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C02 来电者是家庭成员或代办人"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Caller identity"}, {"name": "前置条件", "old": "", "new": "打电话的人不是档案的主人，而是替主人办事：配偶、家人、室友、宠物寄养人、代为接送的朋友。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：在门店认可我们关系的范围内，像主人自己打来一样把事情办了\n3、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、没有为已关联的来电者建立重复的客户档案。；业务记在正确的主人和宠物名下；切换档案后没有混用两份档案的资料、历史或选择。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C02 来电者是家庭成员或代办人\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/caller-acts-for-account-holder.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C02,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r47", "row": 47, "name": "检查 C04 疫苗不合格，门店的规矩是不约", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Prerequisites", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cc3fc70388e", "fp": "06b1520dce34", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C04 疫苗不合格，门店的规矩是不约"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Prerequisites"}, {"name": "前置条件", "old": "", "new": "同时满足三点："}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：立刻知道具体缺什么、怎么补，并且清楚现在还没有约上、这件事已经交给门店\n3、核对：请客户最终确认之前核对。客户确认要为某只宠物预约、且宠物记录可查时就可以核对，不必等服务和时间谈完；核对得早是体验上的期望，不决定对错。日期还没定时先看记录、审核状态和过期日期；日期确定或变化后，按那个日期再核对一次。\n4、有余地时先协商日期：记录存在、已审核、尚未过期，只是目标日期晚于有效期时，可以和客户协商一个在有效期内的日期。客户改到这样的日期并约上的，这件事就办完了，不留待办。谈不成再按下面处理。\n5、不创建：不创建预约，不登记候补，不保留空位。\n6、说清楚缺什么：告诉客户具体是哪一项或哪几项疫苗、问题是缺失、过期还是未审核，不笼统地说“疫苗有问题”。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、没有为不合格的宠物和日期创建预约、候补或保留。\n4、补充说明实际发出，内容覆盖全部不合格的疫苗。\n5、没有把客户口述的接种情况记为合格记录。\n6、请求因为疫苗没有办成时，实际留下了一条待办，只有一条，挂在这段会话上；没有因此转接。补充说明没有发出去时待办照样留下。\n7、没有为不合格的宠物和日期创建预约、候补或保留。；补充说明实际发出，内容覆盖全部不合格的疫苗。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C04 疫苗不合格，门店的规矩是不约\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/vaccine-requirement-blocks-booking.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C04,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r48", "row": 48, "name": "检查 C05 Grooming 的 optional 疫苗有缺口，不阻断预约", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Prerequisites", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "ce464468a19", "fp": "ba8467f76fbb", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C05 Grooming 的 optional 疫苗有缺口，不阻断预约"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Prerequisites"}, {"name": "前置条件", "old": "", "new": "同时满足三点："}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：照常约上，不因为门店并不强制的记录被追问或卡住\n3、不核对：Agent 不为 optional 的疫苗核对宠物的记录。\n4、不阻断：预约或候补照常办理，其他步骤不变。\n5、不提醒：Agent 不主动提起 optional 疫苗的缺口，不要求客户补交，也不发送补充说明。\n6、不留跟进事项：不因为 optional 疫苗的缺口留下 follow-up 或疫苗跟进事项。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、预约按客户确认的内容创建，没有因为 optional 疫苗的缺口被拒绝或搁置。\n4、没有因为 optional 疫苗的缺口留下 follow-up、疫苗跟进事项或发送补充说明。\n5、没有把缺失、过期、未审核或没有核对过的记录说成或记为合格。\n6、required 的疫苗核对先于预约创建；optional 的疫苗不在这个顺序里。\n7、预约按客户确认的内容创建，没有因为 optional 疫苗的缺口被拒绝或搁置。；没有因为 optional 疫苗的缺口留下 follow-up、疫苗跟进事项或发送补充说明。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C05 Grooming 的 optional 疫苗有缺口，不阻断预约\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/vaccine-gap-does-not-block-booking.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C05,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r49", "row": 49, "name": "检查 C06 预约前必须有 card on file、定金或已签协议", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Prerequisites", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "ca7cc3dca54", "fp": "7f95460a10f8", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C06 预约前必须有 card on file、定金或已签协议"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Prerequisites"}, {"name": "前置条件", "old": "", "new": "门店要求客户在预约之前满足某项前置要求，而这位客户的档案当前没有满足。前置要求是下面一种
