或几种："}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：尽早知道还差什么、在哪里补，并且清楚现在还没有约上\n3、核对：请客户最终确认之前核对。客户有预约意图、且档案可查时就可以核对，不必等服务和时间谈完；核对得早是体验上的期望，不决定对错。\n4、不创建：不创建预约，不登记候补，不保留空位。\n5、说清楚差什么：告诉客户具体是哪一项：没有卡、卡已失效、需要定金，还是协议或资料表没有完成。\n6、发送补充入口：把门店提供的添加卡、支付定金或签署协议的入口发给客户。Agent 不在电话里收取卡号、安全码或付款，也不代客户签署或填写。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、没有为不满足前置要求的客户创建预约、候补或保留。\n4、补充入口实际发出，覆盖全部未满足的要求。\n5、通话中没有收集、复述或保存卡号、安全码；没有把协议或资料表记为已完成。\n6、没有因为这件事产生转接或 follow-up，除非补充入口发送失败。\n7、没有为不满足前置要求的客户创建预约、候补或保留。；补充入口实际发出，覆盖全部未满足的要求。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C06 预约前必须有 card on file、定金或已签协议\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/card-on-file-required-before-booking.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C06,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r50", "row": 50, "name": "检查 C17 疫苗有缺口，门店的规矩是照常预约并留跟进", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Prerequisites", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c8335dd3e25", "fp": "bc1f5478a2fd", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C17 疫苗有缺口，门店的规矩是照常预约并留跟进"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Prerequisites"}, {"name": "前置条件", "old": "", "new": "同时满足两点："}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：照常约上，同时清楚知道缺哪些记录、可以怎么补\n3、按所订服务核对：按门店对所订服务的疫苗要求和宠物的记录核对。日期确定或变化后，按那个日期再核对一次。\n4、不阻断：预约照常办理，其他步骤不变。\n5、说清楚缺什么：告诉客户具体是哪一项或哪几项疫苗、问题是缺失还是过期，不笼统地说“疫苗有问题”。缺口较多时，可以在电话中先概括，再通过门店支持的其他方式提供完整清单。\n6、说清楚怎么补：说明门店支持的提交方式。客户不需要在电话中选定其中一种。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、预约按客户确认的内容创建，没有因为疫苗缺口被拒绝或搁置。\n4、本次预约请求只有一条疫苗跟进事项，覆盖全部缺失或过期的疫苗。\n5、没有把客户没有作出的提交方式选择记成客户的承诺。\n6、没有把缺失、过期或没有核实的记录说成或记为合格。\n7、预约按客户确认的内容创建，没有因为疫苗缺口被拒绝或搁置。；本次预约请求只有一条疫苗跟进事项，覆盖全部缺失或过期的疫苗。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C17 疫苗有缺口，门店的规矩是照常预约并留跟进\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/vaccine-gap-for-boarding-or-daycare.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C17,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r51", "row": 51, "name": "检查 C07 Boarding / Daycare 约不上：替代方案或候补", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Availability", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cdd919e0793", "fp": "d130cea7d456", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C07 Boarding / Daycare 约不上：替代方案或候补"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Availability"}, {"name": "前置条件", "old": "", "new": "客户想订的 Boarding 或 Daycare 安排，按当前的查询结果订不上：日期已满、想要的房型没有、多只宠物的组合放不下，或接送时间不被支持。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：知道究竟是哪一部分不行，并且只从确实能订的方案里选，或者在门店支持时排进候补\n3、说明是哪一部分不行：区分日期、房型、宠物组合、接送时间或其他条件，把不可用限定在实际查询的范围内。某种房型没有，不说成全店已满。\n4、只提供真实的替代方案：替代的日期、房型或安排必须是当前查询结果支持的。以前住过某种房型，不能说明它今天可订。\n5、由客户选择：客户询问某个日期，不等于同意改用那个日期。\n6、选定后重新确定受影响的内容：新日期下的房型、接送时间、价格、疫苗要求和 add-on 都按新选择重新确定，再回顾并取得确认。客户对原安排的确认不能用于替代安排。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、订不上的原安排没有被创建，也没有被说成成功。\n4、替代预约中的日期、房型、时间和相关规则都按新选择重新确定，没有沿用原日期的结果或确认。\n5、候补只在门店开启、客户同意且前置条件满足时登记，登记内容与客户确认的一致。\n6、没有重复或多余的预约、候补。\n7、订不上的原安排没有被创建，也没有被说成成功。；替代预约中的日期、房型、时间和相关规则都按新选择重新确定，没有沿用原日期的结果或确认。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C07 Boarding / Daycare 约不上：替代方案或候补\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/no-availability-for-boarding-or-daycare.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C07,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r52", "row": 52, "name": "检查 C08 Grooming 约不上：替代方案或候补", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Availability", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cc4eb698bbb", "fp": "33e16724c1fb", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C08 Grooming 约不上：替代方案或候补"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Availability"}, {"name": "前置条件", "old": "", "new": "客户想约的美容安排，在客户接受的范围内没有真实空位：想要的日期或时间已满、点名的美容师没空、上门美容没有能到达该地址的行程，或者最早的时间比客户希望的晚得多。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：知道究竟是什么约不上，并在换时间、换美容师、排候补之间自己选\n3、把“已满”限定在查过的范围内：说清楚约不上的是哪项服务、哪位美容师、哪段时间。某位美容师没空，不说成全店已满。\n4、提供真实的替代：在客户接受的范围内，提供其他时间或其他有资格做这项服务的美容师。替代的美容师必须由客户同意，不默默换人；客户拒绝过的人选不再提。\n5、最早时间很远时不只给一个远期日期：如实说明最早可约的时间，同时提出候补或其他美容师。\n6、门店开启候补时可以登记：条件见下。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、候补只在门店开启、客户同意且前置条件满足时登记，登记内容与客户确认的一致。\n4、候补没有被说成预约；人工承接没有被说成预约或候补。\n5、预约、候补、follow-up 各自有对应的业务结果。同一件事没有重复的 follow-up。\n6、没有创建客户没有接受的替代预约，没有重复的预约或候补。\n7、候补只在门店开启、客户同意且前置条件满足时登记，登记内容与客户确认的一致。；候补没有被说成预约；人工承接没有被说成预约或候补。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C08 Grooming 约不上：替代方案或候补\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/no-availability-for-grooming.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C08,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r53", "row": 53, "name": "检查 C09 当天或临近时间的预约请求", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Availability", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "ccb3e714fba", "fp": "b804ccf040d3", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C09 当天或临近时间的预约请求"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Availability"}, {"name": "前置条件", "old": "", "new": "客户想约的新服务在今天：今天送去日托、今晚入住、今天下午洗澡、今天上门。“今天”按门店所在时区判断。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：立刻知道今天这件事由谁来定、接下来会怎样\n3、判断：请客户最终确认之前判断，并让判断结果生效。客户说出今天或临近的时间后就可以判断，不必等到收集完其他信息；判断得早是体验上的期望，不决定对错。\n4、当天的预约按这家店的规矩办：三个业态的默认规矩都是交给门店：\n5、是不是当天、该约还是该交给门店，以业务系统的判断为准：Agent 不自己决定破例。\n6、不是当天、但不满足提前预约限制时如实说明：告诉客户这个时间按门店的规则不能直接约，并说明最早可以约到什么时候。这是规则限制，不说成“已经约满”。客户愿意时按最早允许的时间继续办理；仍然需要更早时间的人工承接。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、默认规矩下，Agent 没有创建当天的预约或候补。\n4、门店的规矩允许的当天预约，按与其他日期相同的标准核查空位和前置条件。\n5、没有创建违反门店提前预约限制的预约或候补。\n6、人工承接时，员工拿到客户、宠物、服务和“今天”这一时间要求。\n7、默认规矩下，Agent 没有创建当天的预约或候补。；门店的规矩允许的当天预约，按与其他日期相同的标准核查空位和前置条件。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C09 当天或临近时间的预约请求\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/same-day-request.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C09,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r54", "row": 54, "name": "检查 C16 要约的日期超出门店开放的预约范围", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Availability", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c4672d2c256", "fp": "63c423f47167", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C16 要约的日期超出门店开放的预约范围"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Availability"}, {"name": "前置条件", "old": "", "new": "客户想约的日期，晚于门店当前开放预约的最远日期。例如门店只开放未来 8 周的预约，客户要约 3 个月以后。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：立刻知道那一天现在能不能约，不能的话最远能约到哪天\n3、判断：请客户最终确认之前，按门店的可预约范围判断，并让判断结果生效。客户说出目标日期后就可以判断，不必等到收集完其他信息，也不必先查空位；判断得早是体验上的期望，不决定对错。\n4、不创建：超出范围的日期，不创建预约，不登记候补，不保留名额。\n5、如实说明：告诉客户门店目前只开放到哪一天的预约。这是门店的开放范围，不说成已经约满。门店配置中能看到那一天什么时候开放时，一并说明。\n6、提供能办的选择：客户愿意时，约一个开放范围内的日期；或者等那一天开放后再约。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、没有创建超出门店开放范围的预约、改期、候补或保留。\n4、没有 Agent 自行作出的破例或保留承诺。\n5、人工承接时，员工拿到客户、宠物、服务和目标日期。\n6、开放范围的判断，先于空位承诺和请客户最终确认。在空位查询和完整的资料收集之前判断是体验上的期望，不作为对错的判定。\n7、没有创建超出门店开放范围的预约、改期、候补或保留。；没有 Agent 自行作出的破例或保留承诺。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C16 要约的日期超出门店开放的预约范围\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/date-is-beyond-booking-window.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C16,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r55", "row": 55, "name": "检查 C18 门店的配置不允许客户自己改约或取消", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Availability", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c18ec203cd3", "fp": "49452673a7d2", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C18 门店的配置不允许客户自己改约或取消"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Availability"}, {"name": "前置条件", "old": "", "new": "客户要改约或取消一笔已有的预约，而这次操作不在门店允许客户自己办的范围内。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：立刻知道这件事要由门店来处理，并且我的请求已经带着原因交到门店手里\n3、确定目标预约：按宠物、日期或服务确定是哪一笔，并向客户确认。\n4、不直接办：Agent 不改动、不取消这笔预约，也不查新时间的空位。\n5、如实说明：告诉客户这次改约或取消要由门店处理。不说成办不了，也不说成已经办好；在门店处理之前，原预约仍然有效。\n6、人工承接：交给门店的内容写清：客户、哪一笔预约、离开始还有多久、客户要改到什么时候或要取消的范围、客户说的原因。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、Agent 没有改动、取消或新建任何预约。\n4、员工接手时或待办中，有目标预约、离开始还有多久、客户的请求和原因。\n5、接通或留下待办没有被记成改约或取消成功。\n6、目标预约确定后才判断能不能由 Agent 办。\n7、Agent 没有改动、取消或新建任何预约。；员工接手时或待办中，有目标预约、离开始还有多久、客户的请求和原因。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C18 门店的配置不允许客户自己改约或取消\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/reschedule-or-cancel-not-allowed-by-store-setting.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C18,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r56", "row": 56, "name": "检查 C10 客户问到取消或改期的费用", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c907f3a7a44", "fp": "94494305bcb7", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C10 客户问到取消或改期的费用"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery"}, {"name": "前置条件", "old": "", "new": "客户在取消或改期一笔预约时，问这会不会收费、收多少、定金退不退；或者在咨询时问门店的取消、改期政策。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：问到费用时得到一个靠得住的答复：这一次不收，或者门店自己的政策，而不是一个 Agent 算出来的数\n3、由 Agent 办的改期或取消没有费用：这次操作门店允许客户自己办时，客户问到可以如实告诉他这一次没有费用。这不表示以后也不收，也不涉及定金退不退。\n4、交给门店的，照门店的政策原文说：这次操作要由门店处理，或客户只是咨询政策时，门店留了取消、改期费用政策的文字就照原文告诉客户，并说明这是门店的政策；这一笔收不收由门店处理时决定。\n5、不计算：不告诉客户“这一笔会收多少”，不按“24 小时内”“48 小时内”这类通用说法推断，也不沿用其他门店或其他预约的规则。能不能由 Agent 办，以业务系统的判断为准。\n6、不收取，不承诺：不在会话里收取任何费用，不收卡号；不承诺免除、减少或退还。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、告知客户的费用政策与门店留下的原文一致。\n4、Agent 没有计算、收取任何取消或改期费用，也没有收集支付卡信息。\n5、交给门店的操作，门店没有留政策时，没有编造的政策，也没有被说成没有费用；问题交给了门店。\n6、这次操作由谁办确定之后，才回答这一次有没有费用。\n7、告知客户的费用政策与门店留下的原文一致。；Agent 没有计算、收取任何取消或改期费用，也没有收集支付卡信息。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C10 客户问到取消或改期的费用\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/customer-asks-about-cancel-or-reschedule-fee.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C10,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r57", "row": 57, "name": "检查 C11 营业时间外来电", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c94072bbe22", "fp": "75dd1dde3cce", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C11 营业时间外来电"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery"}, {"name": "前置条件", "old": "", "new": "来电发生在门店的营业时间之外，或者不在门店的转人工窗口内。转人工窗口是门店配置的、员工可以接听实时转接的时段，定义见 人工承接；以门店配置的营业时间、闭店日和转接安排为准。门店没有设转接时（例如…"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：Agent 能办的事照常办完，办不了的事被准确留给门店，并且知道门店什么时候会看到\n3、Agent 能办的事照常办：预约、查询、可以自助的改期和取消、各类咨询，不因为门店下班而改为留言。\n4、不在转人工窗口内时不发起转接：直接告诉来电者现在接不通，不让来电者先听一段等待音再得知没人接。门店配置了营业时间外的渠道时，告诉来电者有这个渠道，仍然留下 follow-up；Agent 不通过它把来电者接过去。\n5、需要人工的事留下 follow-up：征得同意后，留下一条员工可获取、可继续处理的请求，包含来电者是谁、要办的事、已经确认的内容和回电号码。要求与 C12 第 3 到 5 步相同。\n6、说明门店什么时候会处理：按门店的营业时间说明员工最早什么时候会看到这条请求。没有依据时不承诺具体的回电时间。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、需要人工的请求有一条实际留下的 follow-up，内容足以让员工不用回电追问就能开始处理。\n4、时间敏感的请求有明确的标记。\n5、没有 Agent 自行承诺的回电时间、破例或营业时间外的处理。\n6、留下 follow-up 没有被记成原请求已经办成；相关的预约没有被改动。\n7、需要人工的请求有一条实际留下的 follow-up，内容足以让员工不用回电追问就能开始处理。；时间敏感的请求有明确的标记。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C11 营业时间外来电\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/call-outside-business-hours.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C11,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r58", "row": 58, "name": "检查 C12 转接没有人接", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c49f0c21404", "fp": "94a4375ca1ae", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C12 转接没有人接"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery"}, {"name": "前置条件", "old": "", "new": "来电在转人工窗口内，来电者已经同意转接，Agent 已经尝试连接门店员工，但没有员工接手通话，而来电者还在线上。不在转人工窗口内时不发起转接，见 C11。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：Agent 如实告诉我没有接通，并帮我留下一条门店能接着处理的请求\n3、保留转接之前的信息：没有人接之后，对话接着原来的请求继续，不当作一通新电话重新开始。来电者说过的要找谁、什么事、有多急，不要求重讲。来电者之前不愿说明来意的，也保留这个选择。\n4、如实说明没有接通：区分“已经尝试转接”和“员工已经接听”。不把响铃、等待提示或进入转接流程说成接通，也不猜测员工为什么没接。\n5、提出留下 follow-up 并取得同意：来电者同意后确认：要找的人或事由、已经表达的紧急程度、回电号码。来电号码就是回电号码时不用重新报号，只读号码的后四位向来电者确认，并给来电者换号码的机会。来电者不愿说明事由时，如实记为“请求员工回…\n6、留下一条可行动的请求：同一次没有人接只留一条。来电者反复问“会有人联系我吗”，不产生多条相同的请求。转接发生在某个目标中途时，请求中保留已经确认且仍然有效的选择、当前的业务状态和还没办完的事，并写明哪些没有完成。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、门店收到一条包含正确回电号码和必要背景的可行动请求。\n4、请求如实保留来电者要找的人、事由和紧急程度；来电者没有提供的信息没有被猜测或补写。\n5、转接来自某个进行中的目标时，请求保留仍然可信的进度和未完成的事，没有把原目标写成已完成。\n6、同一次没有人接没有产生重复的请求。\n7、门店收到一条包含正确回电号码和必要背景的可行动请求。；请求如实保留来电者要找的人、事由和紧急程度；来电者没有提供的信息没有被猜测或补写。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C12 转接没有人接\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/transfer-is-not-answered.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C12,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r59", "row": 59, "name": "检查 C13 操作失败或结果未知", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c4db152926f", "fp": "4a969c870cc1", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C13 操作失败或结果未知"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery"}, {"name": "前置条件", "old": "", "new": "Agent 在客户确认之后提交了一项业务操作，但没有得到明确的成功结果。业务操作包括：创建、改期或取消预约，登记候补，以及在通话中补全宠物资料。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：在系统没有办成时被如实告知，而不是听到“已经约好”\n3、不说成功，也不说技术细节：没有明确的成功结果时，不告诉客户已约好、已改好、已取消或已登记。不向客户复述报错内容。\n4、结果未知时不重复提交：不再次提交同一个操作。能查询时，先查一次这项操作实际有没有生效：\n5、明确失败时看原因：- 时间已被占用，或者可选的时间不再有效：按 C07、C08 重新提供真实选择，客户重新确认后再提交。\n6、人工承接时交代清楚：员工拿到操作的类型、客户最后确认的方案、失败还是未知，以及 Agent 已经确认过的实际状态。同一项操作只交接一次。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、没有基于失败或未知结果的成功说法。\n4、结果未知时，没有再次提交同一个操作；没有重复的预约、改期、取消或候补。\n5、重新提交只发生在两种情况：确认上一次没有生效后原样重试一次；或方案改变并经客户重新确认之后。同一项操作实际生效最多一次。\n6、人工承接时，员工拿到操作类型、确认的方案和已知的实际状态；同一件事没有重复的 follow-up。\n7、没有基于失败或未知结果的成功说法。；结果未知时，没有再次提交同一个操作；没有重复的预约、改期、取消或候补。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C13 操作失败或结果未知\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/operation-fails-or-result-unknown.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C13,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r60", "row": 60, "name": "检查 C19 请求属于一定交给门店的五类", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c504c78f85d", "fp": "14ef758d1496", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C19 请求属于一定交给门店的五类"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery"}, {"name": "前置条件", "old": "", "new": "来电者说的事属于下面五类之一。它可以是这次联系的主要目的，也可以是办别的事中途提到的。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：这件事由门店的人来处理，并且我说过的情况已经原样交到他们手里\n3、认出来：从来电者的话里认出这五类，不要求来电者使用特定的说法。能用数据判断的也要认出，例如预约已经入住。\n4、交给门店：这件事人工承接，Agent 不自己办，也不给出上表“特别不能做的”那些答复。\n5、其余的事照常办：一次联系里不属于这五类的事，按各自的目标 Story 办。例如约好一笔预约之后客户问起一笔账单：预约照常完成，账单交给门店。\n6、预约时提到健康、术后或攻击记录：不约，人工承接：客户为一只宠物办预约的中途，提到这只宠物的健康问题、术后情况或攻击记录时，Agent 不创建这笔预约，也不登记候补；这件事人工承接：在转人工窗口内转接，没有人接或不在窗口内时留一条 foll…\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、这五类里的事没有由 Agent 自己办完，也没有被说成已经解决。\n4、预约时提到这只宠物的健康、术后情况或攻击记录的，没有创建预约或候补；员工实际接手，或 follow-up 实际留下。\n5、Agent 没有索取、复述或保存支付卡信息。\n6、员工接手时或待办中，有来电者说的情况和回电号码。\n7、这五类里的事没有由 Agent 自己办完，也没有被说成已经解决。；预约时提到这只宠物的健康、术后情况或攻击记录的，没有创建预约或候补；员工实际接手，或 follow-up 实际留下。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C19 请求属于一定交给门店的五类\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/request-must-go-to-store.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C19,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r61", "row": 61, "name": "检查 C20 门店教过的规矩适用于这件事", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cc2d353664f", "fp": "98bf9a2a91f7", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C20 门店教过的规矩适用于这件事"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery"}, {"name": "前置条件", "old": "", "new": "这家店有一条已经生效的规矩适用于来电者当前要办的事，而它与业态的默认做法不同。规矩由店主教给 Agent，存在门店档案里；管一个品牌下所有门店的，存在企业档案里。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：AI 按这家店自己的做法办事\n3、照规矩办：当前的事在一条生效规矩的范围内时，按规矩办，不按业态的默认。\n4、范围外仍按默认：规矩只管它写明的情况。例如规矩是“老客当天的美容，有空位就直接约”，那么新客户的当天请求、没有空位的当天请求仍然交给门店。\n5、规矩不放宽核查：按规矩办的事，照常核查真实空位、前置条件，照常取得客户确认。\n6、不能改的不改：规矩与上表冲突时，上表优先。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、规矩范围内的事按规矩办了；范围外的事按默认办了。\n4、没有一条规矩让 Agent 办了一定交给门店的五类，或绕过了服务端规则和 MoeGo 设置。\n5、按规矩办成的预约，与默认情况下办成的预约满足同样的硬约束。\n6、规矩要求的收费只在客户听到并确认之后才进入预约；客户不接受时没有建单，也没有被 Agent 去掉或免除。\n7、规矩范围内的事按规矩办了；范围外的事按默认办了。；没有一条规矩让 Agent 办了一定交给门店的五类，或绕过了服务端规则和 MoeGo 设置。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C20 门店教过的规矩适用于这件事\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/store-taught-rule-applies.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C20,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r62", "row": 62, "name": "检查 C22 客户隔了一段时间才回复", "level": "P0", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c4476d359e9", "fp": "82bdaf781097", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C22 客户隔了一段时间才回复"}, {"name": "用例等级", "old": "", "new": "P0"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery"}, {"name": "前置条件", "old": "", "new": "Agent 在短信里问了客户一个问题、给了几个时段或发了一个链接，客户过了几个小时或隔天才回。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 短信会话\n2、客户提出请求：回一句就能接着之前的话把事情办完\n3、接着之前的话办：客户的回复按之前的上下文理解。例如 Agent 给了两个时段，客户隔天回“第二个”，指的就是那个时段。\n4、会变的事实重新核查：之前给出的时段、空位、价格在办理前按当前的情况重新核查。时段已经不在时如实说明，并提供新的真实选择，不按过期的信息写入。\n5、方案变了要重新确认：重新核查后安排有变化的，回顾新的安排并取得客户确认后再办。\n6、日期按现在算：客户说的“明天”“周五”按他回复的时间理解；回复让请求变成当天的，按 C09 处理。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、写入的内容是按回复时的真实情况核查过、并经客户确认的。\n4、没有按过期的时段或价格写入。\n5、没有重复的预约、改期、取消或候补。\n6、重新核查，先于按之前给出的选项办理。\n7、写入的内容是按回复时的真实情况核查过、并经客户确认的。；没有按过期的时段或价格写入。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C22 客户隔了一段时间才回复\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/customer-replies-after-a-gap.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C22,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r63", "row": 63, "name": "检查 G04 在 Boarding / Daycare 预约上加订 Grooming", "level": "P1", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Boarding Daycare", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c2b6b29d60d", "fp": "14cb6b851ebe", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G04 在 Boarding / Daycare 预约上加订 Grooming"}, {"name": "用例等级", "old": "", "new": "P1"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Boarding Daycare"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；宠物已建档；要加订的那段 Boarding 或 Daycare 能唯一确定且尚未开始；门店的 Grooming 向外开放自助预约，有适用于这只宠物的服务和真实空位；没有触…"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：顺便给它约一次正式的 Grooming\n3、确定是哪一段住宿或日托：已经约好的，按宠物和日期确定并向客户确认；正在订的，就是这次会话里的那一段。\n4、分清 add-on 和 Grooming，确认可以由 Agent 约：客户要的是 add-on 时按 add-on 办，不进入本故事。门店的这项 Grooming 不开放自助预约时，告诉客户由员工安排（说得早是体验上的期望，不决定对错），…\n5、确定给哪只宠物做、做哪项 Grooming：住宿或日托里有多只宠物时，可以只给其中一只或几只加订；只作用于客户指定的宠物，不带上其他宠物。服务适用于这只宠物、当前向外开放，前置条件照常核对（G07）。\n6、排在住宿期间：Grooming 的日期在这段住宿的入住日和离店日之间；加在日托上的，就是日托当天。哪一天、什么时刻、哪位美容师由客户挑，给客户的都是当前真实的空位和门店实际开放的选择。客户想要的那一天不在住宿期间时，如实说明，不约到住宿之…\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、约上的是客户确认的那一项 Grooming，属于正确的客户、门店和客户指定的宠物；没有用 add-on 或另一项服务顶替，也没有给客户没有指定的宠物加上。\n4、Grooming 的日期在住宿期间之内；时刻和美容师是客户选定的、当前真实可约的。\n5、客户确认的方案包含 Grooming 时，告知其价格和含美容的合计估价；疫苗条件只允许订住宿或日托时，告知对应的纯住宿或日托估价。金额取自业务系统针对该方案的报价。\n6、住宿或日托预约的日期、房型和其他内容没有因为加订 Grooming 被改动。\n7、期望处理：自助完成；门店不开放时人工承接；约上的是客户确认的那一项 Grooming，属于正确的客户、门店和客户指定的宠物；没有用 add-on 或另一项服务顶替，也没有给客户没有指定的宠物加上。；Grooming 的日期在住宿期间之内；时刻和美容师是客户选定的、当前真实可约的。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G04 在 Boarding / Daycare 预约上加订 Grooming\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/book-boarding/customer-adds-grooming-to-stay.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：自助完成；门店不开放时人工承接"}, {"name": "标签", "old": "", "new": "story:G04,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r64", "row": 64, "name": "检查 G16 来电者咨询 Training 并希望训练师回电", "level": "P2", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Staff scheduled", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c332547053f", "fp": "76c503845044", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G16 来电者咨询 Training 并希望训练师回电"}, {"name": "用例等级", "old": "", "new": "P2"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/01 New booking/Staff scheduled"}, {"name": "前置条件", "old": "", "new": "门店提供 Training；门店没有教过关于 Training 的规矩；来电者想为一只宠物了解并报名；来电在转人工窗口内，员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：先听到门店已有的课程信息，再把宠物的情况、训练目标和时间偏好一次说清，交到能判断课程的员工手里\n3、认出这是 Training 的事：不把它当成 Daycare、Boarding 或 Grooming 的预约。来电者已经说了课程名称或训练目标的，不要求他换一种说法。\n4、回答已有的信息：门店的设置里有的课程信息照实回答，设置里没有的不编。一般介绍不说成这只宠物适合某门课，也不说成门店已经接收。\n5、问清需求：哪只宠物、感兴趣的课程或想改善的行为、偏好的日期、时段或频率。只问员工开始判断需要的，不要求来电者先填完一份报名表；已经说过的不重复问。\n6、说明由员工确认：课程是否适合、具体班次、名额和报名结果由门店的员工确认。Agent 不报名，不承诺班次或名额，不对训练效果作保证。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、没有创建课程报名，没有用另一项服务的预约顶替，也没有为了咨询或转接新建不必要的客户资料。\n4、员工接手时或 follow-up 中，有宠物、训练目标、时间偏好和来电者主动说的重要情况。\n5、“员工已接手”没有被记成“已报名”。\n6、同一件事没有重复的 follow-up。\n7、期望处理：回答已有信息；其余人工承接；没有创建课程报名，没有用另一项服务的预约顶替，也没有为了咨询或转接新建不必要的客户资料。；员工接手时或 follow-up 中，有宠物、训练目标、时间偏好和来电者主动说的重要情况。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G16 来电者咨询 Training 并希望训练师回电\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/request-staff-scheduled-service/caller-asks-about-training.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：回答已有信息；其余人工承接"}, {"name": "标签", "old": "", "new": "story:G16,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r65", "row": 65, "name": "检查 G48 客户给已有预约加 add-on", "level": "P1", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c82da22e39c", "fp": "0130f0a957c0", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G48 客户给已有预约加 add-on"}, {"name": "用例等级", "old": "", "new": "P1"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/02 Existing appointment"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；要加的预约能唯一确定且尚未开始；客户要的 add-on 当前开放、适用于这只宠物和这笔预约；没有触发其他条件 Story。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：在那笔预约上再加一项小服务，例如离店前洗个澡、剪指甲\n3、确定是哪一笔预约：按宠物、日期确定并向客户确认。\n4、确定 add-on：匹配到门店当前开放、适用于这只宠物和这笔预约的具体项目。这项 add-on 能不能加在这笔预约上（例如每天的次数、最短入住天数），以业务系统的判断为准。\n5、说明价格：只说系统返回的价格；返回不了时不报数。\n6、回顾并确认：回顾哪一笔预约、加哪一项、在哪一天做、多少钱，客户明确同意。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、只在客户确认的那一笔预约上加了客户确认的那一项；预约的日期、房型、其他服务不变。\n4、加上的 add-on 当前开放、适用，并符合门店对它的限制。\n5、告知的价格与系统返回的一致。\n6、Salon、Mobile 的预约和短信里的请求，Agent 没有改动预约。\n7、期望处理：Boarding、Daycare 自助完成；Salon、Mobile Grooming 人工承接；只在客户确认的那一笔预约上加了客户确认的那一项；预约的日期、房型、其他服务不变。；加上的 add-on 当前开放、适用，并符合门店对它的限制。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G48 客户给已有预约加 add-on\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/add-service-to-appointment/customer-adds-add-on-to-appointment.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：Boarding、Daycare 自助完成；Salon、Mobile Grooming 人工承接"}, {"name": "标签", "old": "", "new": "story:G48,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r66", "row": 66, "name": "检查 G33 来电者只询问空位", "level": "P1", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/04 Inquiry", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c055a8d0802", "fp": "1311c815eef9", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G33 来电者只询问空位"}, {"name": "用例等级", "old": "", "new": "P1"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/04 Inquiry"}, {"name": "前置条件", "old": "", "new": "来电者问的服务门店开放自助预约；问的日期不是今天，满足门店的提前预约限制，也在门店开放的预约范围内；业务系统能给出当前的空位。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：不用先登记，就得到一个按门店当前情况给出的答复\n3、不以建档为前提：回答空位不要求先识别身份或建立档案。有档案且问的是档案里的宠物时，直接使用已有资料。\n4、弄清问的范围：哪项服务、哪只或哪类宠物、哪天或哪段时间；Boarding 要入住和离店的日期，上门美容要服务地址。只问查空位用得上的，已经说过的不重复问。\n5、按当前的真实情况回答：以业务系统当前给出的空位为准，不按以往的情况、营业时间或“平时都有位”来推断。\n6、说明答复的效力：回答空位不是预约，位置没有为来电者保留。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、说出的空位与业务系统当前的情况一致；没有 Agent 推断的空位。\n4、只询问空位的通话没有创建预约、候补或保留，没有创建或更新档案，也没有不必要的 follow-up。\n5、说明当天的预约由门店确认时，没有说成今天有位，也没有承诺门店会接。\n6、需要员工答复时，员工拿到所问的服务、日期和来电者的联系方式。\n7、期望处理：回答；说出的空位与业务系统当前的情况一致；没有 Agent 推断的空位。；只询问空位的通话没有创建预约、候补或保留，没有创建或更新档案，也没有不必要的 follow-up。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G33 来电者只询问空位\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/answer-business-information/caller-asks-about-availability.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：回答"}, {"name": "标签", "old": "", "new": "story:G33,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r67", "row": 67, "name": "检查 G34 来电者询问预约要求与入店准备", "level": "P1", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/04 Inquiry", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cfabccdb3d1", "fp": "3423626605f3", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G34 来电者询问预约要求与入店准备"}, {"name": "用例等级", "old": "", "new": "P1"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/04 Inquiry"}, {"name": "前置条件", "old": "", "new": "来电者问的要求或准备事项，门店的设置里有；问的是一般规则，不需要员工对这只宠物作判断。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：知道这家门店对预约有什么要求、入店时要带什么\n3、不以建档为前提：回答不要求先识别身份或建立档案。\n4、弄清问的是哪项服务：不同服务的要求可以不同。不拿另一项服务的要求来回答；已经说清的不重复问。\n5、按门店的设置回答预约要求：门店对所问服务要求哪些疫苗、预约前要不要 card on file、定金或已签协议、要提前多久约，都以门店当前的设置为准。\n6、按门店留下的说明回答入店准备：例如食物要不要自带、药物和说明怎么交给门店、还要补的疫苗材料怎么交、哪些个人物品可以带。只说门店写明的，不补充门店没有说过的要求。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、答复与门店当前的设置和门店留下的说明一致；取消、改期的政策与门店留下的原文一致。\n4、没有把另一项服务的要求混进答复；没有 Agent 编出来的要求。\n5、没有把说明规则说成或记成已经核对过这只宠物、这位客户或某一笔预约。\n6、没有把一般规则说成个案批准；没有给出用药、病情方面的建议。\n7、期望处理：回答；答复与门店当前的设置和门店留下的说明一致；取消、改期的政策与门店留下的原文一致。；没有把另一项服务的要求混进答复；没有 Agent 编出来的要求。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G34 来电者询问预约要求与入店准备\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/answer-business-information/caller-asks-about-booking-requirements.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：回答"}, {"name": "标签", "old": "", "new": "story:G34,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r68", "row": 68, "name": "检查 G39 客户查询宠物的疫苗记录", "level": "P2", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c73da28b104", "fp": "bffaf1a9d99d", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G39 客户查询宠物的疫苗记录"}, {"name": "用例等级", "old": "", "new": "P2"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff"}, {"name": "前置条件", "old": "", "new": "来电号码匹配到客户档案；要查的宠物在档案里，并且能确定是哪一只；门店当前的记录和所问服务的疫苗要求，足以逐项说明。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：知道门店现在记录了哪些疫苗，以及对我要用的服务来说，哪些还缺、哪些过期了、哪些还确认不了\n3、识别客户：用来电号码确定客户档案。号码匹配后，不另外要求与这次查询无关的身份资料。\n4、确定是哪只宠物：档案里有多只宠物时，按名字确定客户问的是哪一只；不自行选一只，也不说到无关的宠物。\n5、弄清客户关心什么：是看门店记录了什么、某一项疫苗的状态，还是某项服务还缺什么。客户问“齐不齐”时先明确是哪项服务，不同服务的要求可以不同。已经说清的不重复问。\n6、逐项说明当前的记录：分清四种情况：有记录且仍然有效；有记录但已经过期；没有当前有效的记录；现有资料不足以确认。具体到疫苗的项目，不笼统地说“疫苗有问题”。客户问的是某个日期的服务时，按那个日期判断。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、疫苗记录只披露给已经确定的客户档案，对象是这份档案下客户问的那只宠物。\n4、说出的每一项有效、过期、缺失或无法确认，都与门店当前的记录和所问服务当前的要求一致。\n5、没有把客户口述的接种情况、没有审核的记录或状态不明的记录说成合格。\n6、没有把“门店没有记录”说成宠物没有接种；没有给出医疗建议。\n7、期望处理：回答；疫苗记录只披露给已经确定的客户档案，对象是这份档案下客户问的那只宠物。；说出的每一项有效、过期、缺失或无法确认，都与门店当前的记录和所问服务当前的要求一致。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G39 客户查询宠物的疫苗记录\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/get-vaccination-record/customer-checks-vaccination-record.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：回答"}, {"name": "标签", "old": "", "new": "story:G39,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r69", "row": 69, "name": "检查 G40 客户提交疫苗记录或询问是否收到", "level": "P1", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c1b9eb14f2b", "fp": "292d26e0257a", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G40 客户提交疫苗记录或询问是否收到"}, {"name": "用例等级", "old": "", "new": "P1"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff"}, {"name": "前置条件", "old": "", "new": "客户问的是怎么把疫苗记录交给门店；门店设置了提交渠道。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：知道该通过什么方式交；问到收到没有时，由门店里能确认的人来答复我\n3、弄清客户要的是哪一件：要交记录，还是问之前交的收到没有。两件同时出现时分别处理。\n4、说明门店支持的提交渠道：按门店的设置说。有不止一种方式时，客户不需要当场选定其中一种。\n5、不在电话里接收或认定记录：客户口述的接种情况和日期，不记成疫苗记录，也不说成合格。\n6、说明效力：知道怎么交，不等于已经交了；交上来的记录要门店审核后才算数。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、说明的提交渠道与门店的设置一致；门店没有设置时没有 Agent 编出来的渠道。\n4、Agent 没有新增或修改疫苗记录，没有把客户口述的或没有审核的记录记为、说成合格。\n5、Agent 没有说成门店已经收到，或记录已经通过。\n6、问是否收到的：员工实际接手，或 follow-up 实际留下，里面有客户、宠物、所问的记录和回电号码。\n7、期望处理：回答提交渠道；是否收到人工承接；说明的提交渠道与门店的设置一致；门店没有设置时没有 Agent 编出来的渠道。；Agent 没有新增或修改疫苗记录，没有把客户口述的或没有审核的记录记为、说成合格。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G40 客户提交疫苗记录或询问是否收到\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/get-vaccination-record/customer-submits-vaccination-record.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：回答提交渠道；是否收到人工承接"}, {"name": "标签", "old": "", "new": "story:G40,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r70", "row": 70, "name": "检查 G45 非客户来电（供应商、求职、兽医诊所）", "level": "P2", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "c38e4a9bc2f", "fp": "b03f12b300c8", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 G45 非客户来电（供应商、求职、兽医诊所）"}, {"name": "用例等级", "old": "", "new": "P2"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/05 Record payment handoff"}, {"name": "前置条件", "old": "", "new": "来电者不是来为宠物办事的客户；来电在转人工窗口内，员工接听。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：说明来意后被连接给门店里该找的人，或者把话留给他\n3、认出不是客户：从来电者说的来意认出：供应商联系业务、求职者问工作、兽医诊所为工作上的事来电。不因为来电号码没有匹配到档案，就按首次客户开始收集宠物和主人的资料。\n4、问清来意和要找的人：来电者是谁、来自哪家公司或机构、什么事、要找谁。问一次；来电者不愿多说时不再追问。\n5、不建档，不走预约流程：不创建客户或宠物档案，不要求来电者提供宠物资料。\n6、人工承接：告诉来电者将连接门店的员工，征得同意后转接，并让员工拿到来电者是谁、所属的公司或机构、来意、要找的人和回电号码。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、没有为这位来电者创建客户或宠物档案，也没有创建预约。\n4、员工接手时或 follow-up 中，有来电者是谁、所属的公司或机构、来意和回电号码。\n5、来电者没有提供的信息没有被猜测或补写。\n6、没有向来电者披露任何客户或宠物的资料。\n7、期望处理：人工承接，不按新客户处理；没有为这位来电者创建客户或宠物档案，也没有创建预约。；员工接手时或 follow-up 中，有来电者是谁、所属的公司或机构、来意和回电号码。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：G45 非客户来电（供应商、求职、兽医诊所）\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/connect-to-staff/non-customer-caller.md\n等级取自对齐文档 §3.1 Story 优先级；README 期望处理：人工承接，不按新客户处理"}, {"name": "标签", "old": "", "new": "story:G45,source:p0-alignment,type:goal"}], "newId": "", "changeNotes": []}, {"key": "r71", "row": 71, "name": "检查 C03 既有客户为尚未建档的宠物办理", "level": "P1", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Caller identity", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "ce8420bfdcf", "fp": "c52a66e05b2b", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C03 既有客户为尚未建档的宠物办理"}, {"name": "用例等级", "old": "", "new": "P1"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Caller identity"}, {"name": "前置条件", "old": "", "new": "客户自己已经有档案，这次要预约的宠物却不在档案里：新养的宠物、家里的第二只，或以前没有带来过的那一只。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：当场把这只宠物登记到我的档案下，接着把预约办了\n3、先确认档案里确实没有这只宠物：客户说的宠物在档案里找不到时，向客户确认是不是一只还没有登记的宠物，不重复建一只已经在档案里的宠物。\n4、说明并征得同意：告诉客户预约前需要先登记这只宠物，客户愿意继续后才建。只是询价或咨询不算同意。\n5、收集最少必要的资料：只收集门店和这次服务真正需要的宠物资料，例如名字、物种、品种、体重。客户已经说过的内容不重复问，客户本人的资料不重新收集。品种有歧义时先澄清，不凭猜测保存。可选的资料，客户不知道或不愿提供时留空，不编造，也不因此停下。\n6、建在这位客户的档案下：不为这只宠物另建一份客户档案，不改动档案里已有的宠物和资料。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、电话里：新宠物只建了一次，归属于这位客户已有的档案；没有新建客户档案，没有重复的宠物档案。\n4、电话里：宠物资料来自客户或门店支持的标准值，没有猜测或编造的内容；档案里已有的宠物和资料没有被改动。\n5、没有把其他宠物的历史、选择或疫苗记录用在新宠物身上；没有把没有记录的疫苗记成或说成合格。\n6、短信里：Agent 没有新建宠物档案，没有修改资料；待办实际留下，写明哪位客户、哪只新宠物和想约什么。\n7、电话里：新宠物只建了一次，归属于这位客户已有的档案；没有新建客户档案，没有重复的宠物档案。；电话里：宠物资料来自客户或门店支持的标准值，没有猜测或编造的内容；档案里已有的宠物和资料没有被改动。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C03 既有客户为尚未建档的宠物办理\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/existing-customer-brings-new-pet.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C03,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r72", "row": 72, "name": "检查 C24 客户被门店封禁了线上预约", "level": "P1", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Prerequisites", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "caf7e5c2fc2", "fp": "59e4961d73df", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C24 客户被门店封禁了线上预约"}, {"name": "用例等级", "old": "", "new": "P1"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Prerequisites"}, {"name": "前置条件", "old": "", "new": "客户要新建一笔预约，而门店在 MoeGo 里把这位客户设为不能线上预约。"}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：知道这次预约要由门店的员工来安排，并且我想约什么已经交到他们手里\n3、身份确定后认出：确定了是哪位客户、并且业务系统表明他不能线上预约时，按下面的做法办。认出后不必再查空位、选时间；认出得早是体验上的期望，不决定对错。\n4、不创建：不为这位客户创建预约，不登记候补，不保留空位，也不换一个名字或号码来办。\n5、只说由员工安排：告诉客户这次预约要由门店的员工来安排。不告诉客户他被封禁了，也不猜测或解释原因。\n6、人工承接：把客户想约什么交给门店：客户、宠物、服务、希望的日期或时间，以及交给门店的原因 服务和失败的情况；同一件事没有重复的 follow-up。\n7、每一项告诉客户的结果，都与业务系统对这一项的明确结果一致；没办成的没有被记成或说成成功。；已经办成的部分没有被重复提交；没有重复的预约。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C14 多宠或多日期请求只完成了一部分\n对齐文档：https://mengshikeji.feishu.cn/wiki/L9IuwCyltikOsUkiGTacMWyunKh\nStory 原文链接：https://github.com/MoeGolibrary/moego-ai-receptionist/blob/main/evaluation/offline/docs/user-stories/conditions/request-is-partially-completed.md\n等级取自对齐文档 §3.1 Story 优先级"}, {"name": "标签", "old": "", "new": "story:C14,source:p0-alignment,type:condition"}], "newId": "", "changeNotes": []}, {"key": "r74", "row": 74, "name": "检查 C15 找不到客户要查、改或取消的预约", "level": "P1", "module": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery", "oldIds": [], "reasons": ["负责人新增的用例，没有原用例"], "reason": "", "uid": "cd9d43da108", "fp": "54a8c23e9a4e", "added": true, "kind": "高", "fields": [{"name": "用例名称", "old": "", "new": "检查 C15 找不到客户要查、改或取消的预约"}, {"name": "用例等级", "old": "", "new": "P1"}, {"name": "所属模块", "old": "", "new": "/Full test cases v4.0/AI/AI Receptionist/Calling Agent/06 Conditions/Fee and delivery"}, {"name": "前置条件", "old": "", "new": "客户的档案已经确定，客户要查询、改期或取消一笔已有的预约，但按他说的宠物、服务和日期，在业务系统里确定不了这一笔。包括三种情况："}, {"name": "步骤描述", "old": "", "new": "1、准备符合前提的测试数据，发起 AI Receptionist 电话会话\n2、客户提出请求：在系统里查不到它的时候被如实告知，并且这件事已经交到门店手里去核实\n3、请客户补充一次：对不上时，请客户补充或更正一个容易说清的信息：哪只宠物、哪一天、什么服务。不要求客户提供内部编号。查到相近的预约时，可以问客户是不是这一笔；客户确认之前不把它当作目标。\n4、不猜：不把相近的另一笔、另一只宠物的预约，或已经取消、已经结束的预约，当成客户说的那一笔来答复或办理。\n5、不改动任何预约：目标没有确定，就不改期、不取消，也不为了“对上”而新建一笔。\n6、如实说明：告诉客户按他说的信息没有查到这笔预约，这件事交给门店核实。不告诉客户已经改好或已经取消；不替门店断定这笔预约不存在或没有提交成功。\n7、核对系统写入/转接/待办，以及对客说法"}, {"name": "预期结果", "old": "", "new": "1、会话建立；可查看对话、工具调用与业务记录\n2、正确识别意图，进入对应处理路径\n3、Agent 没有改期、取消或新建任何预约。\n4、今天的预约在查询范围内，没有因为漏查而被说成找不到。\n5、员工接手时或待办中，有客户说的那笔预约、他想办的事和 Agent 查过的结果。\n6、接通或留下待办没有被说成已查到、已改期或已取消。\n7、Agent 没有改期、取消或新建任何预约。；今天的预约在查询范围内，没有因为漏查而被说成找不到。；仅在系统成功后宣告办成；失败或未知不得虚报成功"}, {"name": "备注", "old": "", "new": "原 Story：C15 找不到客户要查、改或取消的预约\n对齐文档：https://mengshikeji.feishu.     : `title="${n.abs ? "双击或点 ✎ 改名，可以用 / 改多级，第一级 Squad 不能改；" : ""}拖到这里，就移到最上层"`;
  return `<li><div class="node ${selectedNode === n.path ? "sel" : ""}" data-path="${esc(n.path)}" data-abs="${esc(n.abs)}" ${own}>${caret}<span class="nm">${esc(n.name)}</span>${n.abs ? `<span class="ren" data-rename="1" title="改名">✎</span>` : ""}
    ${state}${flag}<span class="cnt" title="未确认 / 全部">${open.length ? `${open.length}/${cs.length}` : cs.length}</span></div>
    ${kids.length && !shut ? `<ul>${kids.map(treeHtml).join("")}</ul>` : ""}</li>`;
}
const depth = (path) => path.split("/").filter(Boolean).length;
const isShut = (path) => (path in folded ? folded[path] : depth(path) >= 2);
function findNode(n, path) { if (n.path === path) return n; for (const k of Object.values(n.kids)) { const f = findNode(k, path); if (f) return f; } return null; }
function render() {
  const root = moduleTree(visible());
  if (selectedNode === null || !findNode(root, selectedNode)) selectedNode = "";
  const node = findNode(root, selectedNode);
  const lvRank = (c) => c.kind === "高" ? (LEVELS.indexOf(c.level) + 1 || LEVELS.length + 1) : 0;
  const cs = allCases(node).sort((a, b) => KIND_ORDER.indexOf(shown(a)) - KIND_ORDER.indexOf(shown(b)) ||
    KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind) || lvRank(a) - lvRank(b));
  const drawerBtn = `<button class="drawer-btn" data-drawer="1">${drawerOpen ? "« 收起目录" : "☰ 目录"}</button>`;
  $("#main").innerHTML = `<div class="split ${drawerOpen ? "" : "closed"}"><aside class="side tree">
    <div class="tree-tools"><button data-fold="open">全部展开</button><button data-fold="shut">全部收起</button>
      ${moves.length ? `<button data-undo-move="1" title="撤销最近一次改名或拖动">↶ 撤销调整（${moves.length}）</button>` : ""}${drawerBtn}</div><ul>${treeHtml(root)}</ul></aside>
    <div><h2>${drawerOpen ? "" : drawerBtn}${esc(node.name)}（${cs.length} 条）<button class="add-btn" data-add="1" title="在当前选中的模块下新增一条用例">＋ 新增用例</button></h2>${cs.map(caseHtml).join("") || `<div class="empty">没有匹配的用例</div>`}</div></div>`;
}

function renderHead() {
  $("#title").textContent = DATA.title;
  renderChips();
  const last = DATA.runs[0];
  $("#runsSec").innerHTML = DATA.runs.length ? `<details class="box"><summary>运行记录与结论（${DATA.runs.length} 次）<span class="latest">最近一次：${esc(last.time)} ${esc(last.step)} · ${esc(last.result)}${last.details?.length ? "，" + esc(last.details[last.details.length - 1]) : ""}</span></summary><ul class="runs">` +
    DATA.runs.map((r) => `<li><span class="t">${esc(r.time)}</span><b>${esc(r.step)} <span class="${/失败|误删|错误/.test(r.result) ? "bad" : "ok"}">${esc(r.result)}</span></b>
      <ul>${(r.details || []).map((d) => `<li>${esc(d)}</li>`).join("")}</ul></li>`).join("") + `</ul></details>` : "";
}
function renderChips() {
  const n = (k) => DATA.cases.filter((c) => c.kind === k).length, s = (k) => DATA.cases.filter((c) => shown(c) === k).length;
  const fresh = DATA.cases.filter((c) => !isClosed(c) && !c.fresh).length;
  $("#tldr").textContent = `${DATA.file} · 生成于 ${DATA.generated} · 新用例 ${fresh} 条（红 ${n("高")} / 黄 ${n("中")} / 无颜色 ${n("低")}），${n("新增") ? `本轮新增 ${n("新增")} 条，` : ""}退回 ${n("退回")} 条，不迁移 ${n("不迁移")} 条，已确认 ${s("已确认")} 条。`;
  const desc = Object.fromEntries(DATA.summary.map((x) => [x.item.replace(/（.*）/, ""), x.desc]));
  desc["已确认"] = "点过「✓ 已确认」的用例，下次重新生成报告时仍在这里；再点一次「✓ 已确认」取消，回到原来的分类";
  desc["新增"] = "本轮在报告里新增的用例：填好名称、步骤和预期结果后点「✓ 已确认」才会导出";
  desc["不迁移"] = "生成时已判定不迁入（灰行）或负责人在「退回」上点了「不迁移」：只需查看原因，不必再点；不挡「完成审核」";
  const name = {"新增":"新增","退回":"退回","高":"红色","中":"黄色","低":"无颜色","已确认":"已确认","不迁移":"不迁移"};
  $("#chips").innerHTML = `<div class="chip ${filter.kind ? "" : "on"}" data-kind=""><b>${DATA.cases.length}</b>全部</div>` +
    KIND_ORDER.filter((k) => k !== "新增" || s(k)).map((k) => `<div class="chip k-${k} ${filter.kind === k ? "on" : ""}" data-kind="${k}" title="${esc(desc[name[k]] || "")}"><b>${s(k)}</b>${KIND_LABEL[k]}</div>`).join("") +
    (filter.kind === "退回" && s("退回") ? `<div class="tip ret-tip">退回用例：业务负责人在「补齐后」一栏补齐，点「✓ 已确认」；不需要迁移的点「不迁移」并写原因。全部处理后再点「完成审核」。生成时已判定不迁入的应写在「不迁移」，不要放「退回」。</div>` : "") +
    (filter.kind === "不迁移" && n("不迁移") ? `<div class="tip">不迁移用例：生成时已带原因并预标记，查看即可，不必逐条点击。</div>` : "");
}
function renderProgress() {
  const v = Object.values(marks), ok = v.filter((m) => m.status === "ok").length, bad = v.filter((m) => m.status === "issue").length,
    skip = v.filter((m) => m.status === "skip").length;
  const n = Object.keys(edits).length, pending = Object.keys(edits).filter((k) => !confirmed(k)).length;
  $("#progress").textContent = `已确认 ${ok} · 有问题 ${bad}` + (skip ? ` · 不迁移 ${skip}` : "") + ` · 未看 ${DATA.cases.length - ok - bad - skip}` +
    (n ? ` · 已修改 ${n}` + (pending ? `（${pending} 条待确认）` : "") : "") + (moves.length ? ` · 目录调整 ${moves.length} 处` : "");
}
document.addEventListener("click", (e) => {
  const chip = e.target.closest(".chip"); if (chip) { filter.kind = chip.dataset.kind || null; renderChips(); render(); return; }
  const toggle = e.target.closest("[data-toggle]");
  if (toggle) { const p = toggle.dataset.toggle; folded[p] = !isShut(p); render(); return; }
  const fold = e.target.closest("[data-fold]");
  if (fold) { foldAll(fold.dataset.fold === "shut"); render(); return; }
  if (e.target.closest("[data-drawer]")) { drawerOpen = !drawerOpen; render(); return; }
  if (e.target.closest("[data-add]")) { addCase(); return; }
  if (e.target.closest("[data-del-added]")) {
    const key = e.target.closest(".case").dataset.key;
    if (!confirm("删除这条新增用例？")) return;
    added = added.filter((a) => a.key !== key); localStorage.setItem(ADD_STORE, JSON.stringify(added));
    DATA.cases.splice(DATA.cases.findIndex((c) => c.key === key), 1);
    delete edits[key]; delete drafts[key]; delete marks[key]; localStorage.setItem(EDIT_STORE, JSON.stringify(edits));
    save(); renderChips(); render(); toast("已删除这条新增用例"); return;
  }
  if (e.target.closest("[data-undo-move]")) {
    const mv = moves.pop(); localStorage.setItem(MOVE_STORE, JSON.stringify(moves));
    renderProgress(); render(); toast(`已撤销：${mv.from.split("/").pop()} → ${mv.to.split("/").pop()}`); return;
  }
  if (e.target.closest("[data-rename]")) { startRename(e.target.closest(".node")); return; }
  if (e.target.closest("input.rename")) return;
  const node = e.target.closest(".node");
  if (node) { if (node.dataset.path === selectedNode) return; selectedNode = node.dataset.path; expandTo(selectedNode); render(); return; }
  if (e.target.closest("[data-revert]")) {
    const key = e.target.closest(".case").dataset.key;
    delete edits[key]; delete drafts[key]; localStorage.setItem(EDIT_STORE, JSON.stringify(edits));
    if (byKey(key).kind === "退回" && confirmed(key)) { marks[key].status = undefined; prune(key); save(); }
    renderChips(); renderProgress(); render(); return;
  }
  const btn = e.target.closest(".review button");
  if (btn) {
    const key = btn.closest(".case").dataset.key, m = marks[key] ||= {};
    m.status = m.status === btn.dataset.act ? undefined : btn.dataset.act;
    const c0 = byKey(key), asIs = m.status === "ok" && c0.kind === "退回" && !edits[key];
    if (m.status === "ok" && c0.fresh && !edits[key]) {
      m.status = undefined; prune(key);
      const need = btn.closest(".case").querySelector(".need");
      need.textContent = "不能确认：先在表格里填写用例名称、前置条件、步骤描述和预期结果"; need.classList.add("err"); return;
    }
    if (asIs) edits[key] = {kind: c0.kind, row: c0.row, oldIds: c0.oldIds, before: c0.name, data: JSON.parse(JSON.stringify(current(c0)))};
    if (m.status !== "ok" && c0.kind === "退回" && edits[key] && EDIT_FIELDS.every(([, g]) => (g(current(c0)) || "") === (g(edits[key].data) || ""))) {
      delete edits[key]; delete drafts[key]; localStorage.setItem(EDIT_STORE, JSON.stringify(edits));
    }
    if (m.status === "ok" && edits[key]) {
      const err = editError(key);
      if (err) {
        m.status = undefined; prune(key);
        if (asIs) delete edits[key];
        const need = btn.closest(".case").querySelector(".need");
        need.textContent = "不能确认：" + err + (asIs ? "。退回用例请先在「补齐后」一栏补齐，或点「不迁移」" : ""); need.classList.add("err"); return;
      }
      delete drafts[key]; localStorage.setItem(EDIT_STORE, JSON.stringify(edits));

    else if (was && was !== "不迁移" && shown(c) === "不迁移") toast("已移到「不迁移」，可以在「不迁移」分类里给这条写原因", 4000);
    else if ((was === "已确认" || was === "不迁移") && shown(c) !== was) toast(`已移回「${KIND_LABEL[c.kind]}」`);
    if (m.status === "issue" || m.status === "skip") document.querySelector(`.case[data-key="${key}"] textarea.note`)?.focus();
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { filter.q = e.target.value; render(); return; }
  if (e.target.matches(".nv textarea")) {
    const key = e.target.closest(".case").dataset.key, n = e.target.closest(".nv").dataset.field, v = e.target.value, c0 = byKey(key);
    onEdit(key, (d) => {
      if (n === "用例名称") d.name = v.replace(/\n/g, " ");
      if (n === "所属模块") { const m = v.replace(/\n/g, " ").trim(); d.module = m === movePath(c0.module) || m === c0.module ? "" : m; }
      if (n === "前置条件") d.pre = v;
      if (n === "备注") d.remark = v;
      if (n === "标签") d.tags = v;
      if (n === "步骤描述") d.steps = pairs(v, numberedText(d.steps, 1));
      if (n === "预期结果") d.steps = pairs(numberedText(d.steps, 0), v);
    });
    refresh(key); return;
  }
  if (e.target.matches(".review textarea")) {
    const key = e.target.closest(".case").dataset.key, m = marks[key] ||= {};
    m.note = e.target.value; prune(key);
    localStorage.setItem(STORE, JSON.stringify(marks)); renderProgress();
  }
});
function addCase() {
  const node = findNode(moduleTree(visible()), selectedNode || "");
  const near = (node && allCases(node).find((c) => !isClosed(c))) || DATA.cases.find((c) => !isClosed(c)) || DATA.cases[0];
  const module = (node && node.abs) || modOf(near);
  const a = {key: "a" + Date.now(), module};
  added.push(a); localStorage.setItem(ADD_STORE, JSON.stringify(added));
  DATA.cases.push(blankCase(a));
  filter.kind = null; filter.q = ""; $("#q").value = "";
  renderChips(); renderProgress(); render();
  const art = document.querySelector(`.case[data-key="${a.key}"]`);
  art.scrollIntoView({block: "center"});
  art.querySelector('.nv[data-field="用例名称"]').dispatchEvent(new MouseEvent("mousedown", {bubbles: true}));
  toast(`已在「${module.split("/").pop()}」下新增一条用例：填好名称、步骤和预期结果后点「✓ 已确认」`, 4000);
}
function startRename(node) {
  if (!node || !node.dataset.abs || node.querySelector("input.rename")) return;
  const isRoot = !node.dataset.path, abs = node.dataset.abs, nm = node.querySelector(".nm");
  const top = abs.split("/")[1], old = isRoot ? abs.slice(top.length + 2) : abs.split("/").pop();
  node.draggable = false;
  nm.outerHTML = `<input class="rename" value="${esc(old)}">`;
  node.querySelector(".ren")?.remove();
  const input = node.querySelector("input.rename");
  input.focus(); input.select();
  let done = false;
  const finish = (save) => {
    if (done) return; done = true;
    const v = input.value.trim();
    if (!save || v === old) return render();
    if (isRoot) {
      const parts = v.split("/").map((p) => p.trim());
      if (parts.some((p) => !p)) { toast("每一级都不能为空"); return render(); }
      if (parts[0] !== old.split("/")[0]) { toast(`第一级是 Squad「${old.split("/")[0]}」，不能改`); return render(); }
      const to = `/${top}/${parts.join("/")}`;
      if (to.startsWith(abs + "/")) { toast("不能把目录移到它自己下面"); return render(); }
      return moveModule(abs, to, `已改名为「${parts.join("/")}」`);
    }
    if (!v || v.includes("/")) { toast("模块名不能为空，也不能包含 /"); return render(); }
    const to = parentOf(abs) + "/" + v, merged = findAbs(moduleTree(DATA.cases), to);
    moveModule(abs, to, `已改名为「${v}」` + (merged ? "，和已有的同名模块合并" : ""));
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); });
  input.addEventListener("blur", () => finish(true));
}
document.addEventListener("dblclick", (e) => { if (!e.target.closest("input.rename")) startRename(e.target.closest(".node")); });
let dragAbs = null;
const canDrop = (tgt) => dragAbs !== null && !!tgt && tgt !== dragAbs && !tgt.startsWith(dragAbs + "/") && tgt !== parentOf(dragAbs);
document.addEventListener("dragstart", (e) => {
  const node = e.target.closest?.(".node[draggable=true]");
  if (!node) return;
  dragAbs = node.dataset.abs; node.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragAbs);
});
document.addEventListener("dragover", (e) => {
  const node = e.target.closest?.(".node");
  document.querySelectorAll(".node.drop-ok").forEach((x) => x !== node && x.classList.remove("drop-ok"));
  if (!node || !canDrop(node.dataset.abs)) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "move"; node.classList.add("drop-ok");
});
document.addEventListener("drop", (e) => {
  const node = e.target.closest?.(".node");
  if (!node || !canDrop(node.dataset.abs)) return;
  e.preventDefault();
  const name = dragAbs.split("/").pop(), to = node.dataset.abs + "/" + name, from = dragAbs;
  const merged = findAbs(moduleTree(DATA.cases), to);
  dragAbs = null;
  moveModule(from, to, `已把「${name}」移到「${node.querySelector(".nm").textContent}」下` + (merged ? "，和已有的同名模块合并" : ""));
});
document.addEventListener("dragend", () => {
  dragAbs = null;
  document.querySelectorAll(".node.dragging,.node.drop-ok").forEach((x) => x.classList.remove("dragging", "drop-ok"));
});
document.addEventListener("mousedown", (e) => {
  const cell = e.target.closest(".nv.editable");
  if (!cell || cell.querySelector("textarea, select")) return;
  e.preventDefault();
  const c = byKey(cell.closest(".case").dataset.key), n = cell.dataset.field;
  cell.classList.add("editing");
  if (n === "用例等级") {
    const cur = newOf(c, n);
    cell.innerHTML = `<select class="in">${(LEVELS.includes(cur) ? LEVELS : ["", ...LEVELS]).map((l) => `<option ${l === cur ? "selected" : ""} value="${l}">${l || "请选择"}</option>`).join("")}</select>`;
    const sel = cell.querySelector("select"); sel.focus(); try { sel.showPicker(); } catch {}
    return;
  }
  cell.innerHTML = `<textarea class="in" ${n === "用例名称" || n === "所属模块" ? 'rows="1"' : ""} placeholder="${n === "步骤描述" || n === "预期结果" ? "1、…\n2、…" : ""}">${esc(newOf(c, n))}</textarea>`;
  const t = cell.querySelector("textarea"); t.focus(); t.setSelectionRange(t.value.length, t.value.length);
});
document.addEventListener("focusout", (e) => {
  const cell = e.target.closest(".nv");
  if (!cell) return;
  const c = byKey(cell.closest(".case").dataset.key), n = cell.dataset.field;
  cell.classList.remove("editing");
  if (cell.matches("h3.title")) { cell.textContent = titleOf(c.key); return; }
  cell.innerHTML = newCell(c, n);
  if (NEW_ONLY) { cell.previousElementSibling.innerHTML = labelHtml(c, n); return; }
  cell.previousElementSibling.innerHTML = oldCell(c, n);
  cell.previousElementSibling.previousElementSibling.innerHTML = labelHtml(c, n);
});
document.addEventListener("keydown", (e) => {
  if (!e.target.matches(".nv textarea")) return;
  if (e.key === "Escape" || (e.key === "Enter" && (e.metaKey || e.ctrlKey))) { e.preventDefault(); e.target.blur(); }
  else if (e.key === "Enter" && ["用例名称", "所属模块"].includes(e.target.closest(".nv").dataset.field)) e.preventDefault();
});
document.addEventListener("change", (e) => {
  if (!e.target.matches(".nv select, select.lvl")) return;
  const key = e.target.closest(".case").dataset.key, v = e.target.value;
  onEdit(key, (d) => { d.level = v; });
  refresh(key); e.target.blur();
});
$("#exportAll").onclick = exportAll;
renderHead(); renderProgress(); render();
if (roundReset) toast("清单已按上次的审核结果重建，上一轮的标记、修改和目录调整都已写入，这一轮从头审核", 8000);
</script>
</body>
